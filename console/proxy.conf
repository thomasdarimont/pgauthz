# app.pgauthz.test → the console (/console/) and the playground (/playground/).
#
# Mounted into the keycloak overlay's nginx proxy by compose-console.yml, AT THE
# SAME TARGET PATH the playground overlay uses (/etc/nginx/conf.d/playground.conf),
# so that with both overlays active this file wins and serves both apps on the
# one host (two files with the same server_name would conflict). Upstreams are
# resolved per request (Docker DNS): an app whose overlay is not running
# answers 502 on its path, nothing else breaks.
server {
    listen              443 ssl;
    server_name         app.pgauthz.test;

    ssl_certificate     /etc/tls/cert.pem;
    ssl_certificate_key /etc/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 ipv6=off;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    location = / {
        return 302 /console/;
    }

    location /console/ {
        set $upstream_console console-bff;
        proxy_pass http://$upstream_console:8080;
    }

    location /playground/ {
        set $upstream_bff playground-bff;
        proxy_pass http://$upstream_bff:8080;
    }
}
