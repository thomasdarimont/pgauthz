163,550.789 L792.163,540.789" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="389.83" y="563.856" fill="#000" font-size="13" textLength="234.8" font-family="monospace">No network hop: data filtering</text><text x="632.456" y="563.856" fill="#000" font-size="13" textLength="23.48" font-weight="700" font-family="monospace">and</text><text x="663.763" y="563.856" fill="#000" font-size="13" textLength="23.48" font-family="monospace">the</text><text x="389.83" y="578.989" fill="#000" font-size="13" textLength="391.333" font-family="monospace">authorization decision run in the same query plan.</text><text x="389.83" y="594.122" fill="#000" font-size="13" textLength="313.066" font-family="monospace">Wildcard grants come back as a typed row</text><text x="389.83" y="609.255" fill="#000" font-size="13" textLength="367.853" font-family="monospace">(is_wildcard) instead of enumerating the store.</text><text x="389.83" y="624.388" fill="#000" font-size="13" textLength="360.026" font-family="monospace">App roles get EXECUTE on the function API only</text><text x="389.83" y="639.52" fill="#000" font-size="13" textLength="313.066" font-family="monospace">(SECURITY DEFINER) — never table grants.</text></g><!--link app to tables--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk7" data-source-line="23" data-link-type="dependency"><path d="M200.69,104.929 C155.98,111.379 109.68,121.969 96,138.899 C40.52,207.559 83.458,315.65 111.148,370.23" style="stroke:#000;stroke-width:1;" fill="none" id="app-to-tables"/><polygon points="113.41,374.689,112.905,364.853,111.148,370.23,105.771,368.473,113.41,374.689" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="193.007" y="157.966" fill="#000" font-size="13" textLength="140.88" font-family="monospace">one SQL statement:</text><text x="157.787" y="173.099" fill="#000" font-size="13" textLength="211.32" font-family="monospace">SELECT d.* FROM documents d</text><tex