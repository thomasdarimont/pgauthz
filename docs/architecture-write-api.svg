<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1211px;height:991px;background:#FFFFFF;" width="1211px" height="991px" viewBox="0 0 1211 991" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="10"><text x="432.447" y="41.421" fill="#000" font-size="22" textLength="344.373" font-weight="700" font-family="monospace">Write paths to the primary</text></g><rect x="8" y="66.609" width="1190.267" height="16.641" fill="#FFC" style="stroke:#FD8;stroke-width:3;" rx="2.5" ry="2.5"/><text x="15" y="77.25" fill="#000" font-size="10" textLength="295.005" font-family="monospace">Please use CSS style instead of skinparam padding</text><!--cluster optA--><g class="cluster" data-qualified-name="optA" id="ent0005" data-source-line="29"><polygon points="882.6,322.21,892.6,312.21,1090.6,312.21,1090.6,434.81,1080.6,444.81,882.6,444.81,882.6,322.21" fill="#FFF" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1080.6" y1="322.21" x2="1090.6" y2="312.21" style="stroke:#000;stroke-width:1;"/><line x1="882.6" y1="322.21" x2="1080.6" y2="322.21" style="stroke:#000;stroke-width:1;"/><line x1="1080.6" y1="322.21" x2="1080.6" y2="444.81" style="stroke:#000;stroke-width:1;"/><text x="923.599" y="344.205" fill="#000" font-size="14" textLength="118.002" font-weight="700" font-family="monospace">HTTP Write API</text></g><!--entity pgd--><g class="entity" data-qualified-name="optA.pgd" id="ent0006" data-source-line="30"><rect x="898.96" y="364.21" width="175.288" height="64.594" fill="#FA8072" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><text x="914.96" y="393.205" fill="#000" font-size="14" textLength="143.288" font-family="monospace">pgauthzd (writer)</text><text x="914.96" y="409.502" fill="#000" font-size="14" textLength="118.002" font-family="monospace">(full profile)</text></g><!--entity appA--><g class="entity" data-qualified-name="appA" id="ent0001" data-source-line="12"><ellipse cx="986.598" cy="99.25" rx="8" ry="8" fill="#FFF" style="stroke:#000;stroke-width:1;"/><path d="M986.598,107.25 L986.598,134.25 M973.598,115.25 L999.598,115.25 M986.598,134.25 L973.598,149.25 M986.598,134.25 L999.598,149.25" style="stroke:#000;stroke-width:1;" fill="none"/><text x="940.24" y="170.245" fill="#000" font-size="14" textLength="92.716" font-family="monospace">App without</text><text x="940.24" y="186.542" fill="#000" font-size="14" textLength="75.858" font-family="monospace">DB access</text></g><!--entity appB--><g class="entity" data-qualified-name="appB" id="ent0002" data-source-line="13"><ellipse cx="490.599" cy="352.71" rx="8" ry="8" fill="#FFF" style="stroke:#000;stroke-width:1;"/><path d="M490.599,360.71 L490.599,387.71 M477.599,368.71 L503.599,368.71 M490.599,387.71 L477.599,402.71 M490.599,387.71 L503.599,402.71" style="stroke:#000;stroke-width:1;" fill="none"/><text x="452.67" y="423.705" fill="#000" font-size="14" textLength="67.43" font-family="monospace">App with</text><text x="452.67" y="440.002" fill="#000" font-size="14" textLength="75.858" font-family="monospace">DB access</text></g><!--entity appC--><g class="entity" data-qualified-name="appC" id="ent0003" data-source-line="14"><ellipse cx="731.595" cy="352.71" rx="8" ry="8" fill="#FFF" style="stroke:#000;stroke-width:1;"/><path d="M731.595,360.71 L731.595,387.71 M718.595,368.71 L744.595,368.71 M731.595,387.71 L718.595,402.71 M731.595,387.71 L744.595,402.71" style="stroke:#000;stroke-width:1;" fill="none"/><text x="668.38" y="423.705" fill="#000" font-size="14" textLength="118.002" font-family="monospace">Co-located app</text><text x="668.38" y="440.002" fill="#000" font-size="14" textLength="126.431" font-family="monospace">(same database)</text></g><g class="entity" data-qualified-name="N1" id="ent0004" data-source-line="17"><path d="M11,309.85 L11,483.178 L396.2,483.178 L396.2,319.85 L386.2,309.85 L11,309.85" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M386.2,309.85 L386.2,319.85 L396.2,319.85 L386.2,309.85" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="23" y="332.917" fill="#000" font-size="13" textLength="226.973" font-weight="700" font-family="monospace">A: pgauthzd-fronted write API</text><text x="23" y="348.05" fill="#000" font-size="13" textLength="352.2" font-family="monospace">pgauthzd verifies the JWT and the writer role</text><text x="23" y="363.183" fill="#000" font-size="13" textLength="313.066" font-family="monospace">itself (WRITER_ROLE in JWT_ROLES_CLAIM),</text><text x="23" y="378.315" fill="#000" font-size="13" textLength="352.2" font-family="monospace">records the subject as the audit author, then</text><text x="23" y="393.448" fill="#000" font-size="13" textLength="352.2" font-family="monospace">applies the write natively via pgx. No OPA on</text><text x="23" y="408.581" fill="#000" font-size="13" textLength="117.4" font-family="monospace">the write path.</text><text x="23" y="423.714" fill="#000" font-size="13" font-family="monospace"> </text><text x="23" y="438.847" fill="#000" font-size="13" textLength="352.2" font-family="monospace">Multi-app: a per-app DB role from a JWT claim</text><text x="23" y="453.979" fill="#000" font-size="13" textLength="352.2" font-family="monospace">(DB_ROLE_CLAIM) → pgauthzd SET LOCAL ROLEs to</text><text x="23" y="469.112" fill="#000" font-size="13" textLength="46.96" font-family="monospace">it, so</text><text x="77.787" y="469.112" fill="#000" font-size="13" textLength="148.707" font-weight="700" font-family="monospace">namespace isolation</text><text x="234.32" y="469.112" fill="#000" font-size="13" textLength="125.227" font-family="monospace">applies per app.</text></g><!--entity pg--><g class="entity" data-qualified-name="pg" id="ent0007" data-source-line="33"><path d="M673.46,607.17 C673.46,597.17 731.604,597.17 731.604,597.17 C731.604,597.17 789.747,597.17 789.747,607.17 L789.747,660.764 C789.747,670.764 731.604,670.764 731.604,670.764 C731.604,670.764 673.46,670.764 673.46,660.764 L673.46,607.17" style="stroke:#000;stroke-width:1;" fill="#FFA500"/><path d="M673.46,607.17 C673.46,617.17 731.604,617.17 731.604,617.17 C731.604,617.17 789.747,617.17 789.747,607.17" style="stroke:#000;stroke-width:1;" fill="none"/><text x="689.46" y="640.165" fill="#000" font-size="14" textLength="84.287" font-family="monospace">PostgreSQL</text><text x="689.46" y="656.462" fill="#000" font-size="14" textLength="59.001" font-family="monospace">primary</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="45"><path d="M539,711.77 L539,854.833 A0,0 0 0 0 539,854.833 L924.2,854.833 A0,0 0 0 0 924.2,854.833 L924.2,721.77 L914.2,711.77 L735.6,711.77 L731.6,671.01 L727.6,711.77 L539,711.77 A0,0 0 0 0 539,711.77" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M914.2,711.77 L914.2,721.77 L924.2,721.77 L914.2,711.77" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="551" y="734.837" fill="#000" font-size="13" textLength="352.2" font-family="monospace">All three paths land in the same function API</text><text x="551" y="749.97" fill="#000" font-size="13" textLength="344.373" font-family="monospace">(SECURITY DEFINER; app roles never get table</text><text x="551" y="765.103" fill="#000" font-size="13" textLength="336.546" font-family="monospace">grants) and the same immutable audit trail.</text><text x="551" y="780.235" fill="#000" font-size="13" textLength="234.8" font-family="monospace">C additionally makes the grant</text><text x="793.626" y="780.235" fill="#000" font-size="13" textLength="46.96" font-weight="700" font-family="monospace">atomic</text><text x="848.413" y="780.235" fill="#000" font-size="13" textLength="31.307" font-family="monospace">with</text><text x="551" y="795.368" fill="#000" font-size="13" textLength="313.066" font-family="monospace">the business change — see the co-located</text><text x="551" y="810.501" fill="#000" font-size="13" textLength="352.2" font-family="monospace">topology. Apps whose tuples derive from their</text><text x="551" y="825.634" fill="#000" font-size="13" textLength="305.24" font-family="monospace">own DB rows typically feed A or B via a</text><text x="551" y="840.767" fill="#000" font-size="13" textLength="156.533" font-weight="700" font-family="monospace">transactional outbox</text><text x="715.36" y="840.767" fill="#000" font-size="13" textLength="148.707" font-family="monospace">(MODEL_DESIGN §10).</text></g><!--link N1 to pgd--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk8" data-source-line="35" data-link-type="dependency"><path d="M319.09,309.49 C357.61,285.36 402.11,262.4 446.6,250.03 C598.18,207.88 651.94,198.52 800.6,250.03 C865.46,272.5 924.85,327.99 958.31,363.86" style="stroke:#000;stroke-width:1;" fill="none" id="N1-to-pgd"/></g><!--link appA to pgd--><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk9" data-source-line="37" data-link-type="dependency"><path d="M986.6,196.15 C986.6,246.65 986.6,316.6 986.6,358.75" style="stroke:#000;stroke-width:1;" fill="none" id="appA-to-pgd"/><polygon points="986.6,363.75,990.6,354.75,986.6,358.75,982.6,354.75,986.6,363.75" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="993.6" y="234.917" fill="#000" font-size="13" textLength="195.667" font-family="monospace">A: POST /pgauthz/v1/write</text><text x="1020.993" y="250.05" fill="#000" font-size="13" textLength="140.88" font-family="monospace">(JWT: writer role)</text><text x="1001.427" y="265.183" fill="#000" font-size="13" textLength="180.013" font-family="monospace">POST /pgauthz/v1/events</text><text x="1013.167" y="280.315" fill="#000" font-size="13" textLength="156.533" font-family="monospace">(JWT: recorder role)</text></g><!--link pgd to pg--><g c