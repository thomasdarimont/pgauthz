<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1211px;height:970px;background:#FFFFFF;" width="1211px" height="970px" viewBox="0 0 1211 970" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="10"><text x="432.447" y="41.421" fill="#000" font-size="22" textLength="344.373" font-weight="700" font-family="monospace">Write paths to the primary</text></g><!--cluster optA--><g class="cluster" data-qualified-name="optA" id="ent0005" data-source-line="29"><polygon points="882.6,300.569,892.6,290.569,1090.6,290.569,1090.6,413.169,1080.6,423.169,882.6,423.169,882.6,300.569" fill="#FFF" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1080.6" y1="300.569" x2="1090.6" y2="290.569" style="stroke:#000;stroke-width:1;"/><line x1="882.6" y1="300.569" x2="1080.6" y2="300.569" style="stroke:#000;stroke-width:1;"/><line x1="1080.6" y1="300.569" x2="1080.6" y2="423.169" style="stroke:#000;stroke-width:1;"/><text x="923.599" y="322.564" fill="#000" font-size="14" textLength="118.002" font-weight="700" font-family="monospace">HTTP Write API</text></g><!--entity pgd--><g class="entity" data-qualified-name="optA.pgd" id="ent0006" data-source-line="30"><rect x="898.96" y="342.569" width="175.288" height="64.594" fill="#FA8072" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><text x="914.96" y="371.564" fill="#000" font-size="14" textLength="143.288" font-family="monospace">pgauthzd (writer)</text><text x="914.96" y="387.861" fill="#000" font-size="14" textLength="118.002" font-family="monospace">(full profile)</text></g><!--entity appA--><g class="entity" data-qualified-name="appA" id="ent0001" data-source-line="12"><ellipse cx="986.598" cy="77.609" rx="8" ry="8" fill="#FFF" style="stroke:#000;stroke-width:1;"/><path d="M986.598,85.609 L986.598,112.609 M973.598,93.609 L999.598,93.609 M986.598,112.609 L973.598,127.609 M986.598,112.609 L999.598,127.609" style="stroke:#000;stroke-width:1;" fill="none"/><text x="940.24" y="148.604" fill="#000" font-size="14" textLength="92.716" font-family="monospace">App without</text><text x="940.24" y="164.901" fill="#000" font-size="14" textLength="75.858" font-family="monospace">DB access</text></g><!--entity appB--><g class="entity" data-qualified-name="appB" id="ent0002" data-source-line="13"><ellipse cx="490.599" cy="331.069" rx="8" ry="8" fill="#FFF" style="stroke:#000;stroke-width:1;"/><path d="M490.599,339.069 L490.599,366.069 M477.599,347.069 L503.599,347.069 M490.599,366.069 L477.599,381.069 M490.599,366.069 L503.599,381.069" style="stroke:#000;stroke-width:1;" fill="none"/><text x="452.67" y="402.064" fill="#000" font-size="14" textLength="67.43" font-family="monospace">App with</text><text x="452.67" y="418.361" fill="#000" font-size="14" textLength="75.858" font-family="monospace">DB access</text></g><!--entity appC--><g class="entity" data-qualified-name="appC" id="ent0003" data-source-line="14"><ellipse cx="731.595" cy="331.069" rx="8" ry="8" fill="#FFF" style="stroke:#000;stroke-width:1;"/><path d="M731.595,339.069 L731.595,366.069 M718.595,347.069 L744.595,347.069 M731.595,366.069 L718.595,381.069 M731.595,366.069 L744.595,381.069" style="stroke:#000;stroke-width:1;" fill="none"/><text x="668.38" y="402.064" fill="#000" font-size="14" textLength="118.002" font-family="monospace">Co-located app</text><text x="668.38" y="418.361" fill="#000" font-size="14" textLength="126.431" font-family="monospace">(same database)</text></g><g class="entity" data-qualified-name="N1" id="ent0004" data-source-line="17"><path d="M11,288.209 L11,461.538 L396.2,461.538 L396.2,298.209 L386.2,288.209 L11,288.209" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M386.2,288.209 L386.2,298.209 L396.2,298.209 L386.2,288.209" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="23" y="311.276" fill="#000" font-size="13" textLength="226.973" font-weight="700" font-family="monospace">A: pgauthzd-fronted write API</text><text x="23" y="326.409" fill="#000" font-size="13" textLength="352.2" font-family="monospace">pgauthzd verifies the JWT and the writer role</text><text x="23" y="341.542" fill="#000" font-size="13" textLength="313.066" font-family="monospace">itself (WRITER_ROLE in JWT_ROLES_CLAIM),</text><text x="23" y="356.675" fill="#000" font-size="13" textLength="352.2" font-family="monospace">records the subject as the audit author, then</text><text x="23" y="371.808" fill="#000" font-size="13" textLength="352.2" font-family="monospace">applies the write natively via pgx. No OPA on</text><text x="23" y="386.94" fill="#000" font-size="13" textLength="117.4" font-family="monospace">the write path.</text><text x="23" y="402.073" fill="#000" font-size="13" font-family="monospace"> </text><text x="23" y="417.206" fill="#000" font-size="13" textLength="352.2" font-family="monospace">Multi-app: a per-app DB role from a JWT claim</text><text x="23" y="432.339" fill="#000" font-size="13" textLength="352.2" font-family="monospace">(DB_ROLE_CLAIM) → pgauthzd SET LOCAL ROLEs to</text><text x="23" y="447.472" fill="#000" font-size="13" textLength="46.96" font-family="monospace">it, so</text><text x="77.787" y="447.472" fill="#000" font-size="13" textLength="148.707" font-weight="700" font-family="monospace">namespace isolation</text><text x="234.32" y="447.472" fill="#000" font-size="13" textLength="125.227" font-family="monospace">applies per app.</text></g><!--entity pg--><g class="entity" data-qualified-name="pg" id="ent0007" data-source-line="33"><path d="M673.46,585.529 C673.46,575.529 731.604,575.529 731.604,575.529 C731.604,575.529 789.747,575.529 789.747,585.529 L789.747,639.123 C789.747,649.123 731.604,649.123 731.604,649.123 C731.604,649.123 673.46,649.123 673.46,639.123 L673.46,585.529" style="stroke:#000;stroke-width:1;" fill="#FFA500"/><path d="M673.46,585.529 C673.46,595.529 731.604,595.529 731.604,595.529 C731.604,595.529 789.747,595.529 789.747,585.529" style="stroke:#000;stroke-width:1;" fill="none"/><text x="689.46" y="618.524" fill="#000" font-size="14" textLength="84.287" font-family="monospace">PostgreSQL</text><text x="689.46" y="634.821" fill="#000" font-size="14" textLength="59.001" font-family="monospace">primary</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="45"><path d="M539,690.129 L539,833.192 A0,0 0 0 0 539,833.192 L924.2,833.192 A0,0 0 0 0 924.2,833.192 L924.2,700.129 L914.2,690.129 L735.6,690.129 L731.6,649.369 L727.6,690.129 L539,690.129 A0,0 0 0 0 539,690.129" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M914.2,690.129 L914.2,700.129 L924.2,700.129 L914.2,690.129" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="551" y="713.196" fill="#000" font-size="13" textLength="352.2" font-family="monospace">All three paths land in the same function API</text><text x="551" y="728.329" fill="#000" font-size="13" textLength="344.373" font-family="monospace">(SECURITY DEFINER; app roles never get table</text><text x="551" y="743.462" fill="#000" font-size="13" textLength="336.546" font-family="monospace">grants) and the same immutable audit trail.</text><text x="551" y="758.595" fill="#000" font-size="13" textLength="234.8" font-family="monospace">C additionally makes the grant</text><text x="793.626" y="758.595" fill="#000" font-size="13" textLength="46.96" font-weight="700" font-family="monospace">atomic</text><text x="848.413" y="758.595" fill="#000" font-size="13" textLength="31.307" font-family="monospace">with</text><text x="551" y="773.728" fill="#000" font-size="13" textLength="313.066" font-family="monospace">the business change — see the co-located</text><text x="551" y="788.86" fill="#000" font-size="13" textLength="352.2" font-family="monospace">topology. Apps whose tuples derive from their</text><text x="551" y="803.993" fill="#000" font-size="13" textLength="305.24" font-family="monospace">own DB rows typically feed A or B via a</text><text x="551" y="819.126" fill="#000" font-size="13" textLength="156.533" font-weight="700" font-family="monospace">transactional outbox</text><text x="715.36" y="819.126" fill="#000" font-size="13" textLength="148.707" font-family="monospace">(MODEL_DESIGN §10).</text></g><!--link N1 to pgd--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk8" data-source-line="35" data-link-type="dependency"><path d="M319.09,287.849 C357.61,263.719 402.11,240.759 446.6,228.389 C598.18,186.239 651.94,176.879 800.6,228.389 C865.46,250.859 924.85,306.349 958.31,342.219" style="stroke:#000;stroke-width:1;" fill="none" id="N1-to-pgd"/></g><!--link appA to pgd--><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk9" data-source-line="37" data-link-type="dependency"><path d="M986.6,174.509 C986.6,225.009 986.6,294.959 986.6,337.109" style="stroke:#000;stroke-width:1;" fill="none" id="appA-to-pgd"/><polygon points="986.6,342.109,990.6,333.109,986.6,337.109,982.6,333.109,986.6,342.109" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="993.6" y="213.276" fill="#000" font-size="13" textLength="195.667" font-family="monospace">A: POST /pgauthz/v1/write</text><text x="1020.993" y="228.409" fill="#000" font-size="13" textLength="140.88" font-family="monospace">(JWT: writer role)</text><text x="1001.427" y="243.542" fill="#000" font-size="13" textLength="180.013" font-family="monospace">POST /pgauthz/v1/events</text><text x="1013.167" y="258.675" fill="#000" font-size="13" textLength="156.533" font-family="monospace">(JWT: recorder role)</text></g><!--link pgd to pg--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk10" data-source-line="38" data-link-type="dependency"><path d="M996.06,407.509 C1005.73,446.909 1014.95,514.079 980.6,555.529 C956.72,584.359 860.822,598.916 795.022,605.846" style="stroke:#000;stroke-width:1;" fill="none" id="pgd-to-pg"/><polygon points="790.05,606.369,799.419,609.405,795.022,605.846,798.582,601.449,790.05,606.369" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1011.68" y="515.596" fill="#000" font-size="13" textLength="172.187" font-family="monospace">SQL (pgx; authz_writer</text><text x="1035.16" y="530.729" fill="#000" font-size="13" textLength="125.227" font-family="monospace">or per-app role)</text></g><!--link appB to pg--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk11" data-source-line="40" data-link-type="dependency"><path d="M486.93,428.059 C487.06,467.909 494,521.569 525.6,555.529 C545.57,576.999 614.643,592.396 668.243,601.676" style="stroke:#000;stroke-width:1;" fill="none" id="appB-to-pg"/><polygon points="673.17,602.529,664.984,597.053,668.243,601.676,663.62,604.935,673.17,602.529" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="567.82" y="500.596" fill="#000" font-size="13" textLength="101.747" font-family="monospace">B: direct SQL</text><text x="559.993" y="515.729" fill="#000" font-size="13" textLength="117.4" font-family="monospace">write_tuple() /</text><text x="532.6" y="530.862" fill="#000" font-size="13" textLength="172.187" font-family="monospace">write_tuples_checked()</text><text x="544.34" y="545.995" fill="#000" font-size="13" textLength="148.707" font-family="monospace">(authz_writer role)</text></g><!--link appC to pg--><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" id="lnk12" data-source-line="42" data-link-type="dependency"><path d="M726.8,427.789 C724.16,463.689 721.91,512.539 724.6,555.529 C725,561.869 725.067,563.612 725.817,570.112" style="stroke:#000;stroke-width:1;" fill="none" id="appC-to-pg"/><polygon points="726.39,575.079,729.332,565.68,725.817,570.112,721.385,566.597,726.39,575.079" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="798.127" y="508.096" fill="#000" font-size="13" textLength="101.747" font-family="monospace">C: co-located</text><text x="731.6" y="523.229" fill="#000" font-size="13" textLength="234.8" font-family="monospace">business write + write_tuple()</text><text x="778.56" y="538.362" fill="#000" font-size="13" textLength="140.88" font-family="monospace">in ONE transaction</text></g><g class="legend" data-source-line="55"><rect x="10" y="847.192" width="1091.16" height="110.891" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="35.429" y="879.187" fill="#000" font-size="14" textLength="42.144" font-weight="700" font-family="monospace">Color</text><text x="106.43" y="879.187" fill="#000" font-size="14" textLength="75.858" font-weight="700" font-family="monospace">Component</text><rect x="21" y="888.489" width="71.001" height="28.297" fill="#FA8072" style="stroke:none;"/><text x="27" y="907.484" fill="#000" font-size="14" font-family="monospace"> </text><text x="106.43" y="907.484" fill="#000" font-size="14" textLength="969.302" font-family="monospace">pgauthzd (writer) — full profile; the write front door; verifies the writer role itself, applies the write natively</text><rect x="21" y="916.786" width="71.001" height="28.297" fill="#FFA500" style="stroke:none;"/><text x="27" y="935.781" fill="#000" font-size="14" font-family="monospace"> </text><text x="106.43" y="935.781" fill="#000" font-size="14" textLength="210.718" font-family="monospace">PostgreSQL — authz schema</text><line x1="21" y1="860.192" x2="1090.16" y2="860.192" style="stroke:#000;stroke-width:1;"/><line x1="21" y1="888.489" x2="1090.16" y2="888.489" style="stroke:#000;stroke-width:1;"/><line x1="21" y1="916.786" x2="1090.16" y2="916.786" style="stroke:#000;stroke-width:1;"/><line x1="21" y1="945.083" x2="1090.16" y2="945.083" style="stroke:#000;stroke-width:1;"/><line x