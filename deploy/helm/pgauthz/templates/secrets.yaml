{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgauthz.secretName" . }}
  labels: {{- include "pgauthz.labels" . | nindent 4 }}
type: Opaque
stringData:
  # opa-admin-token guards OPA's admin API; native-service-token is the shared
  # SERVICE credential OPA presents to the pgauthzd reader/writer callback
  # listeners (matching their INTERNAL_SERVICE_TOKEN).
  opa-admin-token: {{ .Values.secrets.opaAdminToken | quote }}
  native-service-token: {{ .Values.secrets.nativeServiceToken | quote }}
---
# basic-auth secrets for CloudNativePG managed roles (username + password).
# The Secret name mirrors the DB ROLE it carries (authzen_direct), not a k8s
# service. authzen_direct is the read-only role for the decision-only pgauthzd
# (the reader callback + the AuthZEN 1.0 API — one process).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgauthz.fullname" . }}-authzen-direct
  labels: {{- include "pgauthz.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: authzen_direct
  password: {{ .Values.secrets.authzenDirectPassword | quote }}
---
# pgauthzd_rw — writer role for the pgauthzd writer (full) callback.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgauthz.fullname" . }}-pgauthzd-rw
  labels: {{- include "pgauthz.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: pgauthzd_rw
  password: {{ .Values.secrets.pgauthzdRwPassword | quote }}
{{- if .Values.console.enabled }}
---
# authz_console — the console BFF's engine login.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgauthz.fullname" . }}-console-engine
  labels: {{- include "pgauthz.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: authz_console
  password: {{ .Values.secrets.consoleEnginePassword | quote }}
---
# console — owner/login of the sessions database.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgauthz.fullname" . }}-console-sessions
  labels: {{- include "pgauthz.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: console
  password: {{ .Values.secrets.consoleSessionsPassword | quote }}
{{- if .Values.console.issuer }}
---
# The console's confidential OIDC client.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgauthz.fullname" . }}-console-oidc
  labels: {{- include "pgauthz.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ required "console.issuer needs secrets.consoleClientSecret (the OIDC client's secret) — or secrets.existingSecret with key console-client-secret" .Values.secrets.consoleClientSecret | quote }}
{{- end }}
{{- if and .Values.console.localAdmin.user .Values.console.localAdmin.password }}
---
# The local admin sign-in's password (console.localAdmin).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgauthz.fullname" . }}-console-local-admin
  labels: {{- include "pgauthz.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.console.localAdmin.user | quote }}
  password: {{ .Values.console.localAdmin.password | quote }}
{{- end }}
{{- end }}
{{- if .Values.derivedRelations.enabled }}
---
# pgauthz_derived_worker — the derived-relations refresh worker's login.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgauthz.fullname" . }}-derived-worker
  labels: {{- include "pgauthz.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: pgauthz_derived_worker
  password: {{ .Values.secrets.derivedWorkerPassword | quote }}
{{- if .Values.derivedRelations.publication.enabled }}
---
# replicator — what subscribers of publication authz_derived connect with.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgauthz.fullname" . }}-replicator
  labels: {{- include "pgauthz.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: replicator
  password: {{ .Values.secrets.replicatorPassword | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- /* basic-auth secrets for extraRoles that don't reference an existingSecret */}}
{{- range .Values.extraRoles }}
{{- if not .existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgauthz.fullname" $ }}-extrarole-{{ .name | replace "_" "-" }}
  labels: {{- include "pgauthz.labels" $ | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .name }}
  password: {{ required (printf "extraRoles[%s]: set either 'password' or 'existingSecret'" .name) .password | quote }}
{{- end }}
{{- end }}
