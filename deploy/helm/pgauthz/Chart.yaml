apiVersion: v2
name: pgauthz
description: >-
  PostgreSQL-native Zanzibar/OpenFGA authorization engine on Kubernetes, backed
  by CloudNativePG. pgauthzd (AuthZEN 1.0 + native API, JWT) is the front door;
  OPA is an opt-in policy sidecar that calls back into pgauthzd; PostgreSQL and
  the callback listeners are internal-only. Optional derived-relations worker
  and publication for application databases.
type: application
version: 0.18.0
appVersion: "0.18.0"
keywords: [authorization, zanzibar, openfga, rebac, postgres, cloudnative-pg, opa]
home: https://github.com/thomasdarimont/pgauthz
maintainers:
  - name: Thomas Darimont
annotations:
  # CloudNativePG is a CLUSTER-SCOPED operator and a prerequisite, not a
  # subchart — install it once per cluster (see the chart README). This chart
  # only creates a CloudNativePG `Cluster` (and `Pooler`) custom resource.
  category: Security
