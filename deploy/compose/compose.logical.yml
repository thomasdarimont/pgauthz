# Override: logical replication for subscribers of the derived tables
# (publication authz_derived). Layer it on compose.yml with the `derived`
# profile and DERIVED_RELATIONS=1, REPLICATOR_PASSWORD set in .env:
#
#   docker compose -f compose.yml -f compose.logical.yml --profile derived up -d --wait
#
# Subscribers must reach PostgreSQL, so the port is published — on DB_BIND
# (default: every interface; restrict it, and put TLS/pg_hba rules in front for
# anything beyond a private network). Subscriber recipe: README.md.
services:
  db:
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-250}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - random_page_cost=1.1
      - -c
      - idle_in_transaction_session_timeout=${PG_IDLE_IN_TXN_TIMEOUT:-60s}
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=${PG_MAX_WAL_SENDERS:-10}
      - -c
      # one permanent slot per subscription + one per table during initial sync
      - max_replication_slots=${PG_MAX_REPLICATION_SLOTS:-10}
    ports:
      - "${DB_BIND:-0.0.0.0}:${DB_PORT:-5432}:5432"
  migrate:
    environment:
      DERIVED_RELATIONS: "1"
      DERIVED_PUBLICATION: "1"
      REPLICATOR_PASSWORD: "${REPLICATOR_PASSWORD:?set REPLICATOR_PASSWORD in .env for logical replication}"
