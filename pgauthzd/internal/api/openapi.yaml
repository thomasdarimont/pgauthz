                properties:
                  store: { type: string }
                  recorders:
                    type: array
                    items: { $ref: '#/components/schemas/RecorderAllowlist' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /pgauthz/v1/admin/stores/{store}/recorders/{role}:
    parameters:
      - { name: store, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z_][a-zA-Z0-9_]{0,62}$' } }
      - { name: role, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z_][a-zA-Z0-9_]{0,62}$' }, description: The recording DB role. }
    put:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminSetRecorder
      summary: Make the role's allowlist exactly these actions
      description: >
        grant_recorder_actions after lifting the previous list, in one
        transaction. Every action must be a declared relation of the store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actions]
              properties:
                actions: { type: array, items: { type: string }, minItems: 1 }
      responses:
        '200':
          description: The allowlist in force.
          content:
            application/json:
              schema:
                type: object
                properties:
                  store: { type: string }
                  db_role: { type: string }
                  actions: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    delete:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminDeleteRecorder
      summary: Lift the role's allowlist (it may then record any declared action)
      responses:
        '200':
          description: Lifted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  store: { type: string }
                  db_role: { type: string }
                  deleted: { type: boolean, enum: [true] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }
