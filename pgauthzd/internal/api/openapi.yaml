        - serviceToken: []
      x-pgauthz-availability:
        listeners: [public, internal-callback]
        public_listener: not-when-opa-fronted
        profile: full
      operationId: reserveEvent
      summary: Strict tier — decide and record the request under a per-subject lock
      description: >
        For PEPs that need a HARD bound: under an advisory lock per (store,
        subject) the engine takes the full decision (graph + temporal gates)
        and, if allowed, records the `request` event in the same transaction;
        a refusal records a `denied` event unless record_denied is false. N
        parallel reserves against a cap of K yield exactly K allows. Call it
        because you are about to act, never as a side effect of asking; then
        record the `response` as usual. Subject resolution and RECORDER_ROLE
        gating follow /pgauthz/v1/check and /events. consistency defaults to
        `applied`.
