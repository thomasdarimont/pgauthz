        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/FreshnessConflict' }
        '500': { $ref: '#/components/responses/ServerError' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /stores/{store}/pgauthz/v1/list-objects:
    post:
      tags: [native-read]
      security:
        - bearerAuth: []
        - serviceToken: []
      x-pgauthz-availability:
        listeners: [public, internal-callback]
        public_listener: not-when-opa-fronted
      operationId: listObjectsStore
      summary: Object search, store-scoped
      parameters:
        - $ref: '#/components/parameters/StorePath'
        - $ref: '#/components/parameters/ConsistencyHeader'
        - $ref: '#/components/parameters/RevisionHeader'
      requestBody: { $ref: '#/components/requestBodies/NativeListObjects' }
      responses:
        '200': { $ref: '#/components/responses/NativeListObjectsOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/FreshnessConflict' }
        '500': { $ref: '#/components/responses/ServerError' }
        '501': { $ref: '#/components/responses/NotImplemented' }

