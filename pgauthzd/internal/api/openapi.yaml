components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        PUBLIC listener: an end-user/service JWT from a trusted issuer
        (multi-issuer via JWT_ISSUERS). Per-issuer store and db-role bindings
        apply; writes additionally require the WRITER_ROLE claim.
    serviceToken:
      type: http
      scheme: bearer
      description: >
        INTERNAL callback listener only — sent to the PUBLIC listener it is
        rejected (401, it is not a JWT). The shared service credential
        (Authorization: Bearer <INTERNAL_SERVICE_TOKEN>), optionally layered
        under mTLS. The listener trusts its OPA upstream — it does NOT
        re-verify the end-user JWT, and honors the X-PGAuthz-Role header
        (per-app DB role) asserted by OPA. Never expose this listener to
        untrusted callers.

  parameters:
    StorePath:
      name: store
      in: path
      required: true
      schema: { type: string }
      description: The pgauthz store (tenant) this request is scoped to.
    StoreHeader:
      name: X-PGAuthz-Store
      in: header
      required: false
      schema: { type: string }
      description: >
        Store selection for unscoped paths: the /stores/{store} path segment
        wins, then this header, then the instance's DEFAULT_STORE.
    ConsistencyHeader:
      name: X-PGAuthz-Consistency
      in: header
      required: false
      schema:
        type: string
        enum: [minimize_latency, at_least_as_fresh]
      description: >
        Read consistency. `at_least_as_fresh` REQUIRES an
        X-PGAuthz-Revision token and demands read-your-writes: the node serves
        the read only if it has replayed to the token's WAL position on the
        token's timeline; otherwise 409 (or transparent primary fallback).
        Default: minimize_latency (answer locally).
    RevisionHeader:
      name: X-PGAuthz-Revision
      in: header
      required: false
      schema: { type: string }
      description: >
        The opaque freshness token returned by an earlier write; required with
        `X-PGAuthz-Consistency: at_least_as_fresh`.
    DetailHeader:
      name: X-PGAuthz-Detail
      in: header
      required: false
      schema: { type: string, enum: ["true"] }
      description: >
        Opt into the rich decision detail on the AuthZEN evaluation response
        (state allow|deny|conditional, missing_context, conditions, reason,
        model) — returned in the response `context` field.

  headers:
    XPGAuthzRevision:
      schema: { type: string }
      description: >
        Freshness token minted for this write (HMAC-signed {kid, timeline,
        LSN}). Present a later read with it via X-PGAuthz-Revision +
        X-PGAuthz-Consistency: at_least_as_fresh for read-your-writes.
    XPGAuthzRevisionStatus:
      schema:
        type: string
        enum: [issued, unavailable, disabled]
      description: >
        Mint outcome for this write. `issued` = token in X-PGAuthz-Revision;
        `unavailable` = freshness is enabled but minting failed (the write
        itself committed); `disabled` = freshness not configured.
    XPGAuthzStale:
      schema:
        type: string
        enum: [stale, wrong_epoch, unknown]
      description: The freshness verdict that caused a 409.
    XPGAuthzServedBy:
      schema: { type: string, enum: [primary] }
      description: >
        Present when the read was transparently served from the primary
        fallback pool because the local replica wasn't fresh enough.

  requestBodies:
    Evaluation:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EvaluationRequest' }
    Evaluations:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EvaluationsRequest' }
    SearchSubject:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SearchSubjectRequest' }
    SearchResource:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SearchResourceRequest' }
    SearchAction:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SearchActionRequest' }
    NativeCheck:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NativeCheckRequest' }
    NativeCheckBatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NativeCheckBatchRequest' }
    NativeListObjects:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NativeListObjectsRequest' }
    NativeListSubjects:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NativeListSubjectsRequest' }
    NativeListActions:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NativeListActionsRequest' }
    Explain:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ExplainRequest' }
    Watch:
      required: false
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WatchRequest' }
    WriteTuples:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WriteTuplesRequest' }
    DeleteUser:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DeleteUserRequest' }
    WriteChecked:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WriteCheckedRequest' }
    Grant:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GrantRequest' }
    ApplyGrants:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApplyGrantsRequest' }
    GrantOptions:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GrantOptionsRequest' }
    RelationUsage:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RelationUsageRequest' }
    RecordEvents:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RecordEventsRequest' }
    ReserveEvent:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReserveEventRequest' }

  responses:
    EvaluationOK:
      description: The access decision.
      headers:
        X-PGAuthz-Served-By: { $ref: '#/components/headers/XPGAuthzServedBy' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EvaluationResponse' }
    EvaluationsOK:
      description: One decision per evaluation, in order.
      headers:
        X-PGAuthz-Served-By: { $ref: '#/components/headers/XPGAuthzServedBy' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EvaluationsResponse' }
    SearchSubjectOK:
      description: Subjects that can perform the action on the resource.
      headers:
        X-PGAuthz-Served-By: { $ref: '#/components/headers/XPGAuthzServedBy' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SearchSubjectResponse' }
    SearchResourceOK:
      description: Resources the subject can perform the action on.
      headers:
        X-PGAuthz-Served-By: { $ref: '#/components/headers/XPGAuthzServedBy' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SearchResourceResponse' }
    SearchActionOK:
      description: Actions the subject can perform on the resource.
      headers:
        X-PGAuthz-Served-By: { $ref: '#/components/headers/XPGAuthzServedBy' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SearchActionResponse' }
    WellKnownOK:
      description: AuthZEN PDP metadata (§9.1).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WellKnownResponse' }
          examples:
            store-scoped:
              summary: GET /.well-known/authzen-configuration/stores/authzen_cert
              value:
                policy_decision_point: https://pdp.example.com/stores/authzen_cert
                access_evaluation_endpoint: https://pdp.example.com/stores/authzen_cert/access/v1/evaluation
                access_evaluations_endpoint: https://pdp.example.com/stores/authzen_cert/access/v1/evaluations
                search_subject_endpoint: https://pdp.example.com/stores/authzen_cert/access/v1/search/subject
                search_resource_endpoint: https://pdp.example.com/stores/authzen_cert/access/v1/search/resource
                search_action_endpoint: https://pdp.example.com/stores/authzen_cert/access/v1/search/action
                capabilities: [evaluation, evaluations, subject-search, resource-search, action-search]
    NativeCheckOK:
      description: The raw decision (plus optional rich detail).
      headers:
        X-PGAuthz-Served-By: { $ref: '#/components/headers/XPGAuthzServedBy' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NativeCheckResponse' }
    NativeCheckBatchOK:
      description: One boolean per check, in order.
      headers:
        X-PGAuthz-Served-By: { $ref: '#/components/headers/XPGAuthzServedBy' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NativeCheckBatchResponse' }
    NativeListObjectsOK:
      description: Object IDs the subject can act on (keyset-paginated).
      headers:
        X-PGAuthz-Served-By: { $ref: '#/components/headers/XPGAuthzServedBy' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NativeListObjectsResponse' }
    NativeListSubjectsOK:
      description: Subject IDs that can act on the object (keyset-paginated).
      headers:
        X-PGAuthz-Served-By: { $ref: '#/components/headers/XPGAuthzServedBy' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NativeListSubjectsResponse' }
    NativeListActionsOK:
      description: Relations the subject holds on the object.
      headers:
        X-PGAuthz-Served-By: { $ref: '#/components/headers/XPGAuthzServedBy' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NativeListActionsResponse' }
    ExplainOK:
      description: >
        The engine's explain_access JSON verbatim: result, decision
        {allowed, reason}, summary (human-readable trace), tree, steps.
      headers:
        X-PGAuthz-Served-By: { $ref: '#/components/headers/XPGAuthzServedBy' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ExplainResponse' }
    WatchOK:
      description: >
        The engine's watch_changes JSON verbatim: changes[], cursor, and
        has_more.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WatchResponse' }
    WriteOK:
      description: Tuples written.
      headers:
        X-PGAuthz-Revision: { $ref: '#/components/headers/XPGAuthzRevision' }
        X-PGAuthz-Revision-Status: { $ref: '#/components/headers/XPGAuthzRevisionStatus' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WriteResponse' }
    DeleteOK:
      description: Tuples deleted.
      headers:
        X-PGAuthz-Revision: { $ref: '#/components/headers/XPGAuthzRevision' }
        X-PGAuthz-Revision-Status: { $ref: '#/components/headers/XPGAuthzRevisionStatus' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DeleteResponse' }
    ApplyGrantsOK:
      description: Every entry applied (or already so).
      headers:
        X-PGAuthz-Revision: { $ref: '#/components/headers/XPGAuthzRevision' }
        X-PGAuthz-Revision-Status: { $ref: '#/components/headers/XPGAuthzRevisionStatus' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApplyGrantsResponse' }
    RelationUsageOK:
      description: The relation's usage on the object — direct and effective counts, caps and headroom.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RelationUsageResponse' }
    RelationFull:
      description: >
        The write was refused because the relation's max_direct cap on the
        object is reached (a relation constraint of the model, SQLSTATE
        ZA001): "full", not "forbidden" — revoke an assignment or raise the
        cap. detail carries the object, relation, cap and current count of
        active assignments.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RelationFull' }
    GrantOptionsOK:
      description: The subject's sharing options on the object.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GrantOptionsResponse' }
    GrantOK:
      description: The grant / revoke was decided and applied (or was already so).
      headers:
        X-PGAuthz-Revision: { $ref: '#/components/headers/XPGAuthzRevision' }
        X-PGAuthz-Revision-Status: { $ref: '#/components/headers/XPGAuthzRevisionStatus' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GrantResponse' }
    WriteCheckedOK:
      description: >
        The engine's write_tuples_checked JSON verbatim — applied (bool),
        precondition results, and counts. The freshness token rides the
        X-PGAuthz-Revision header only.
      headers:
        X-PGAuthz-Revision: { $ref: '#/components/headers/XPGAuthzRevision' }
        X-PGAuthz-Revision-Status: { $ref: '#/components/headers/XPGAuthzRevisionStatus' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WriteCheckedResponse' }
    RecordEventsOK:
      description: Events recorded.
      headers:
        X-PGAuthz-Revision: { $ref: '#/components/headers/XPGAuthzRevision' }
        X-PGAuthz-Revision-Status: { $ref: '#/components/headers/XPGAuthzRevisionStatus' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RecordEventsResponse' }
    ReserveEventOK:
      description: The decision, and what was recorded.
      headers:
        X-PGAuthz-Revision: { $ref: '#/components/headers/XPGAuthzRevision' }
        X-PGAuthz-Revision-Status: { $ref: '#/components/headers/XPGAuthzRevisionStatus' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReserveEventResponse' }
    NotFound:
      description: No such resource (an unknown Swagger UI asset name, no binding for the issuer).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
        text/plain:
          schema: { type: string }
    UnsupportedMediaType:
      description: >
        The request declared a Content-Type other than application/json
        (AuthZEN 1.0 §10.1). A charset parameter and +json suffixes are fine;
        a request without a Content-Type header is read as JSON.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: >
        Malformed request — invalid JSON, missing required fields, a subject,
        resource type or action the store's model does not declare ("Unknown
        type: …" / "Unknown relation: …" on the decision paths), an invalid
        consistency mode, or an invalid/forged/retired freshness token (one
        opaque message for every bad-token cause; the reason is logged
        server-side only).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing/invalid bearer token (or service token on the internal listener).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: >
        Authorization failure — issuer store/db-role binding violation,
        missing WRITER_ROLE claim on a public write, SEARCH_REQUIRED_ROLE not
        held, a forbidden per-app DB role, a write to a read-only
        (decision-only) instance, or a management call refused by the admin
        gate or outside the caller's admin scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EvaluationsForbidden:
      description: >
        Authorization failure — or, on an OPA-fronted instance with policy
        hooks mounted, a hook veto of the WHOLE batch (denied_by_policy_hook
        with structured denials; a veto is never reported as a fake all-false
        result).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/PolicyHookDenied'
    FreshnessConflict:
      description: >
        An at_least_as_fresh read this node cannot satisfy. The
        verdict picks the recovery: stale/unknown → retry the primary or
        another replica; wrong_epoch → NOT retryable, and NOT fixed by an
        unrelated new token: a failover happened since the write and the
        write itself may have been lost — re-read and reconcile the intended
        authorization state on the current primary (reapply the change
        idempotently if missing), then use that write's token. This matters
        most for revokes/offboarding. primary_consulted=true means the
        transparent fallback already re-checked the primary and it cannot
        satisfy the token either.
      headers:
        X-PGAuthz-Stale: { $ref: '#/components/headers/XPGAuthzStale' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FreshnessConflict' }
    ServerError:
      description: Internal error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotImplemented:
      description: >
        The operation requires a capability this instance does not have
        (e.g. native reads without a direct pgx backend, or native writes
        without the full profile's writer backend).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ── admin: stores and models ─────────────────────────────────────────────
    AdminStore:
      type: object
      required: [name, description, created_at]
      properties:
        name: { type: string }
        description: { type: string }
        docs_url: { type: string }
        created_at: { type: string, format: date-time }
        retired_at: { type: string, format: date-time, description: Present for a retired store. }
        model: { $ref: '#/components/schemas/ModelStatus' }
    AdminStoreResult:
      type: object
      required: [store, created]
      properties:
        store: { $ref: '#/components/schemas/AdminStore' }
        created: { type: boolean }
    ModelStatus:
      type: object
      description: authz.model_status — null fields for an unmanaged store.
      properties:
        model_name: { type: string, nullable: true }
        model_version: { type: integer, nullable: true }
        applied_at: { type: string, format: date-time, nullable: true }
        applied_by: { type: string, nullable: true }
        in_sync: { type: boolean, nullable: true }
        live_checksum: { type: string }
        expected_checksum: { type: string, nullable: true }
    ModelDefinition:
      type: object
      description: >
        The canonical model (authz.export_model, format 1): types, relations,
        rules, type restrictions, conditions, gates, grant rules — what
        pgauthzctl model export prints and the registry stores.
      required: [format, types, relations, rules, type_restrictions, conditions]
      properties:
        format: { type: integer, enum: [1] }
        types: { type: array, items: { type: object, additionalProperties: true } }
        relations: { type: array, items: { type: object, additionalProperties: true } }
        rules: { type: array, items: { type: object, additionalProperties: true } }
        type_restrictions: { type: array, items: { type: object, additionalProperties: true } }
        conditions: { type: array, items: { type: object, additionalProperties: true } }
        gates: { type: array, items: { type: object, additionalProperties: true } }
        grant_rules: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: true
    IssuerBindingAudit:
      type: object
      required: [seq, action, performed_at, performed_by, issuer, stores]
      properties:
        seq: { type: integer, format: int64 }
        action: { type: string }
        performed_at: { type: string, format: date-time }
        performed_by: { type: string }
        issuer: { type: string }
        stores: { type: array, items: { type: string } }
        enabled: { type: boolean, nullable: true }
        description: { type: string }
    StoreDeletion:
      type: object
      required: [store_id, deleted_at]
      properties:
        store_id: { type: integer }
        deleted_at: { type: string, format: date-time }
        deleted_by: { type: string }
    SubjectRef:
      type: object
      required: [type, id]
      properties:
        type: { type: string }
        id: { type: string }
    SubjectObject:
      type: object
      required: [object_type, relation, object_id, is_wildcard, direct, truncated]
      properties:
        object_type: { type: string }
        relation: { type: string }
        object_id: { type: string, description: "`*` on the wildcard row." }
        is_wildcard: { type: boolean }
        direct: { type: boolean, description: A stored tuple names the object outright. }
        truncated: { type: boolean, description: "This (type, relation) pair hit the limit." }
    RecorderAllowlist:
      type: object
      required: [db_role, actions]
      properties:
        db_role: { type: string }
        actions: { type: array, items: { type: string } }
    Namespace:
      type: object
      required: [name, types, access]
      properties:
        name: { type: string }
        types: { type: array, items: { type: string } }
        access:
          type: array
          items: { $ref: '#/components/schemas/NamespaceGrant' }
    NamespaceGrant:
      type: object
      properties:
        store: { type: string }
        namespace: { type: string }
        db_role: { type: string }
        can_read: { type: boolean }
        can_write: { type: boolean }
    ModelPlan:
      type: object
      description: authz.plan_model_apply — the changes, the blockers, can_apply, no_op.
      additionalProperties: true
    ModelVersion:
      type: object
      required: [name, version, checksum, created_at]
      properties:
        name: { type: string }
        version: { type: integer }
        checksum: { type: string }
        description: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    # ── issuers ──────────────────────────────────────────────────────────────
    IssuerSet:
      type: object
      required: [source, revision, issuers]
      properties:
        source:
          type: string
          enum: [env, env+db]
        revision:
          type: integer
          description: Applied revision of the database bindings (0 = environment only).
        issuers:
          type: array
          items:
            type: object
            required: [issuer, audience, enabled, binding_source, stores, db_roles]
            properties:
              issuer: { type: string }
              audience: { type: string }
              enabled: { type: boolean }
              binding_source: { type: string, enum: [env, db] }
              jwks: { type: string, enum: [url, file] }
              jwks_url: { type: string }
              jwks_file: { type: string, description: Base name only. }
              stores: { type: array, items: { type: string } }
              db_roles: { type: array, items: { type: string } }
              client_db_roles: { type: object, additionalProperties: { type: string } }
              pep_clients:
                type: object
                additionalProperties: { type: array, items: { type: string } }
              admin:
                type: object
                description: The issuer's management grant (environment only).
                properties:
                  scopes: { type: array, items: { type: string } }
                  claims: { type: object, additionalProperties: { type: array, items: { type: string } } }
                  clients: { type: array, items: { type: string } }
                  scope: { type: string, enum: [issuer, platform] }
    IssuerBinding:
      type: object
      description: >
        One row of authz.issuer_bindings — what an issuer's tokens may do
        here. Patterns are anchored regular expressions, as in JWT_ISSUERS.
      required: [issuer]
      properties:
        issuer: { type: string, description: The token `iss` — must be trusted by JWT_ISSUERS. }
        stores: { type: array, items: { type: string }, description: "Store patterns (empty = unbound; allowed only when the environment leaves the issuer unbound)." }
        db_roles: { type: array, items: { type: string } }
        client_db_roles: { type: object, additionalProperties: { type: string } }
        pep_clients:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        enabled: { type: boolean, description: false pauses the issuer — every token refused (401). }
        description: { type: string }
        created_at: { type: string, format: date-time, readOnly: true, description: The row's first write (kept by a replace). }
        created_by: { type: string, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true, description: The row's last write. }
        updated_by: { type: string, readOnly: true }
    # ── shared vocabulary ────────────────────────────────────────────────────
    Subject:
      type: object
      properties:
        type: { type: string, description: Subject type (e.g. internal_user)., example: internal_user }
        id: { type: string, description: Subject identifier., example: alice }
        properties:
          type: object
          additionalProperties: true
          description: >
            Not matched by the graph, but condition input: passed to the engine
            as context.subject = {type, id, properties} (MODEL_DESIGN §8). A
            caller context key named like an entity is replaced by the block.
          example: {}
      description: >
        On the public listener a request subject must match the JWT-derived
        subject unless ALLOW_SUBJECT_OVERRIDE is enabled (trusted-PEP mode);
        an omitted subject defaults to the authenticated one (the official
        AuthZEN schema requires subject — pgauthzd is deliberately more
        lenient here).
    Action:
      type: object
      properties:
        name: { type: string, description: The relation/permission to test (e.g. can_read)., example: can_read }
        properties:
          type: object
          additionalProperties: true
          description: >
            Not matched by the graph, but condition input: passed to the engine
            as context.action = {name, properties} (MODEL_DESIGN §8).
          example: {}
    Resource:
      type: object
      properties:
        type: { type: string, example: document }
        id: { type: string, example: doc_payroll_001 }
        properties:
          type: object
          additionalProperties: true
          description: >
            Not matched by the graph, but condition input: passed to the engine
            as context.resource = {type, id, properties} (MODEL_DESIGN §8).
          example: {}
    Context:
      type: object
      additionalProperties: true
      description: Request context for conditional (ABAC) tuples.
      example: {}
    PageToken:
      type: object
      properties:
        token:
          type: string
          description: >
            Opaque cursor from the previous page's next_token. Under
            at_least_as_fresh the freshness floor is BOUND into this cursor,
            so later pages stay at least as fresh as the first.
        limit:
          type: integer
          minimum: 1
          description: Page size (AuthZEN 1.0 §8.2).
        size:
          type: integer
          minimum: 1
          deprecated: true
          description: Pre-1.0 spelling of limit, still read (limit wins).
    PageResult:
      type: object
      properties:
        next_token: { type: string }
      required: [next_token]

    # ── AuthZEN ──────────────────────────────────────────────────────────────
    EvaluationRequest:
      type: object
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        action: { $ref: '#/components/schemas/Action' }
        resource: { $ref: '#/components/schemas/Resource' }
        context: { $ref: '#/components/schemas/Context' }
    EvaluationResponse:
      type: object
      properties:
        decision: { type: boolean }
        context:
          type: object
          additionalProperties: true
          description: >
            Rich decision detail — a pgauthz EXTENSION returned only when the
            caller opts in via X-PGAuthz-Detail: state allow|deny|conditional,
            missing_context, conditions, reason, model. Note this is not the
            official AuthZEN response-context reason envelope ({id,
            reason_admin, reason_user}); callers that never send the header
            never see a context field.
      required: [decision]
    EvaluationsRequest:
      type: object
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        action: { $ref: '#/components/schemas/Action' }
        resource: { $ref: '#/components/schemas/Resource' }
        context: { $ref: '#/components/schemas/Context' }
        options:
          type: object
          properties:
            evaluations_semantic:
              type: string
              enum: [execute_all, deny_on_first_deny, permit_on_first_permit]
              default: execute_all
          description: >
            AuthZEN 1.0 §7.1.2 request options. With deny_on_first_deny /
            permit_on_first_permit the response array ends with the decision
            that stopped processing (§7.1.2.1); an unknown value is a 400.
        semantic:
          type: string
          enum: [execute_all, deny_on_first_deny, permit_on_first_permit]
          deprecated: true
          description: Pre-1.0 spelling of options.evaluations_semantic, still read.
        evaluations:
          type: array
          items: { $ref: '#/components/schemas/EvaluationRequest' }
      description: >
        Top-level subject/action/resource/context are shared defaults merged
        into each evaluation. An evaluation that still lacks a subject, action
        or resource after merging is answered as {"decision": false} in its
        place (§7.1.1), not as a 400. Without an evaluations array — absent or
        empty — the request is handled exactly like the single Access
        Evaluation API and answered in the single-decision form (§7.1).
    EvaluationsResponse:
      type: object
      properties:
        evaluations:
          type: array
          items: { $ref: '#/components/schemas/EvaluationResponse' }
      required: [evaluations]
    SearchSubjectRequest:
      type: object
      properties:
        subject:
          allOf: [{ $ref: '#/components/schemas/Subject' }]
          description: Only subject.type is used (the type to search).
        action: { $ref: '#/components/schemas/Action' }
        resource: { $ref: '#/components/schemas/Resource' }
        context: { $ref: '#/components/schemas/Context' }
        page: { $ref: '#/components/schemas/PageToken' }
      required: [subject, action, resource]
    SearchResourceRequest:
      type: object
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        action: { $ref: '#/components/schemas/Action' }
        resource:
          allOf: [{ $ref: '#/components/schemas/Resource' }]
          description: Only resource.type is used (the type to search).
        context: { $ref: '#/components/schemas/Context' }
        page: { $ref: '#/components/schemas/PageToken' }
      required: [subject, action, resource]
    SearchActionRequest:
      type: object
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        resource: { $ref: '#/components/schemas/Resource' }
        context: { $ref: '#/components/schemas/Context' }
      required: [subject, resource]
    SearchSubjectResponse:
      type: object
      description: >
        AuthZEN 1.0 §8.4.2: results are the subject objects themselves
        ({type, id}), not wrapped items. `page` comes first on the wire.
      properties:
        page: { $ref: '#/components/schemas/PageResult' }
        results:
          type: array
          items: { $ref: '#/components/schemas/Subject' }
      required: [results]
    SearchResourceResponse:
      type: object
      description: >
        AuthZEN 1.0 §8.5.2: results are the resource objects themselves
        ({type, id}). `page` comes first on the wire.
      properties:
        page: { $ref: '#/components/schemas/PageResult' }
        results:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
      required: [results]
    SearchActionResponse:
      type: object
      description: >
        AuthZEN 1.0 §8.6.2: results are the action objects themselves ({name}).
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/Action' }
      required: [results]
    WellKnownResponse:
      type: object
      description: >
        AuthZEN 1.0 §9.1 PDP metadata. Every value is an absolute URL under the
        PDP identifier; parameters without a value are omitted, never null or
        empty (§9.2.2). `signed_metadata` (§9.1.3) is not issued.
      properties:
        policy_decision_point:
          type: string
          format: uri
          description: >
            The PDP identifier (§9.1.1): this instance's base URL, plus
            `/stores/{store}` for a store-scoped document. Identical to the
            identifier the metadata was fetched for (§9.2.3).
        access_evaluation_endpoint:
          type: string
          format: uri
          description: Access Evaluation API (§6), `<identifier>/access/v1/evaluation`.
        access_evaluations_endpoint:
          type: string
          format: uri
          description: Access Evaluations (batch) API (§7), `<identifier>/access/v1/evaluations`.
        search_subject_endpoint:
          type: string
          format: uri
          description: Subject Search API (§8.4), `<identifier>/access/v1/search/subject`.
        search_resource_endpoint:
          type: string
          format: uri
          description: Resource Search API (§8.5), `<identifier>/access/v1/search/resource`.
        search_action_endpoint:
          type: string
          format: uri
          description: Action Search API (§8.6), `<identifier>/access/v1/search/action`.
        capabilities:
          type: array
          items: { type: string }
          description: >
            What this PDP implements (§9.1.2): evaluation, evaluations,
            subject-search, resource-search, action-search.
      required: [policy_decision_point]

    # ── native reads ─────────────────────────────────────────────────────────
    NativeCheckRequest:
      type: object
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        action: { $ref: '#/components/schemas/Action' }
        resource: { $ref: '#/components/schemas/Resource' }
        context: { $ref: '#/components/schemas/Context' }
        detail:
          type: boolean
          description: Opt into the rich result (the native X-PGAuthz-Detail).
        contextual_tuples:
          type: array
          items: { $ref: '#/components/schemas/TupleInput' }
          description: >
            Ephemeral tuples evaluated alongside the stored graph for this
            check only (never persisted). Requires the contextual-reader
            capability on the connection role, and a caller the instance's
            CONTEXTUAL_TUPLES mode admits (default trusted-peps: a client
            that may assert a subject for the store); otherwise 403.
      required: [action, resource]
    NativeCheckResponse:
      type: object
      properties:
        allowed: { type: boolean }
        detail:
          type: object
          additionalProperties: true
          description: Rich decision detail (only when requested and supported).
      required: [allowed]
    NativeCheckBatchRequest:
      type: object
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        action: { $ref: '#/components/schemas/Action' }
        resource: { $ref: '#/components/schemas/Resource' }
        context: { $ref: '#/components/schemas/Context' }
        semantic:
          type: string
          enum: [execute_all, deny_on_first_deny, permit_on_first_permit]
          default: execute_all
        checks:
          type: array
          items: { $ref: '#/components/schemas/NativeCheckRequest' }
      required: [checks]
      description: >
        Top-level subject/action/resource are shared defaults merged into each
        check (same convention as AuthZEN /evaluations).
    NativeCheckBatchResponse:
      type: object
      properties:
        results:
          type: array
          items: { type: boolean }
      required: [results]
    NativeListObjectsRequest:
      type: object
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        action: { $ref: '#/components/schemas/Action' }
        resource:
          allOf: [{ $ref: '#/components/schemas/Resource' }]
          description: Only resource.type is used.
        context: { $ref: '#/components/schemas/Context' }
        limit: { type: integer, minimum: 1, description: Raw paging (callback callers). }
        offset: { type: integer, minimum: 0 }
        after: { type: string, description: Raw keyset cursor (callback callers). }
        page: { $ref: '#/components/schemas/PageToken' }
      required: [action, resource]
    NativeListObjectsResponse:
      type: object
      properties:
        objects:
          type: array
          items: { type: string }
        next_token: { type: string }
      required: [objects]
    NativeListSubjectsRequest:
      type: object
      properties:
        subject:
          allOf: [{ $ref: '#/components/schemas/Subject' }]
          description: Only subject.type is used.
        action: { $ref: '#/components/schemas/Action' }
        resource: { $ref: '#/components/schemas/Resource' }
        context: { $ref: '#/components/schemas/Context' }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
        after: { type: string }
        page: { $ref: '#/components/schemas/PageToken' }
      required: [subject, action, resource]
    NativeListSubjectsResponse:
      type: object
      properties:
        subjects:
          type: array
          items: { type: string }
        next_token: { type: string }
      required: [subjects]
    NativeListActionsRequest:
      type: object
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        resource: { $ref: '#/components/schemas/Resource' }
        context: { $ref: '#/components/schemas/Context' }
      required: [resource]
    NativeListActionsResponse:
      type: object
      properties:
        actions:
          type: array
          items: { type: string }
      required: [actions]
    ExplainRequest:
      type: object
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        action: { $ref: '#/components/schemas/Action' }
        resource: { $ref: '#/components/schemas/Resource' }
        context: { $ref: '#/components/schemas/Context' }
      required: [action, resource]
    ExplainResponse:
      type: object
      additionalProperties: true
      description: >
        authz.explain_access JSON verbatim — result (bool), decision
        {allowed, reason}, summary (human-readable), tree (recursive trace),
        steps (flat step list).
    WatchRequest:
      type: object
      properties:
        after_at: { type: string, description: Timestamp cursor (changed_at of the last seen change). }
        after_seq: { type: integer, format: int64, description: Tie-break sequence cursor. }
        limit: { type: integer, minimum: 1 }
        lag: { type: string, description: "Safety lag interval (e.g. '1 second')." }
        object_types:
          type: array
          items: { type: string }
        namespaces:
          type: array
          items: { type: string }
        relations:
          type: array
          items: { type: string }
    WatchResponse:
      type: object
      additionalProperties: true
      description: >
        authz.watch_changes JSON verbatim — changes[], cursor {at, seq},
        has_more.

    # ── native writes ────────────────────────────────────────────────────────
    TupleInput:
      type: object
      properties:
        user_type: { type: string }
        user_id: { type: string }
        user_relation:
          type: string
          description: Set for userset subjects (e.g. team#member → 'member').
        relation: { type: string }
        object_type: { type: string }
        object_id: { type: string }
        condition: { type: string, description: Name of a condition gating this tuple. }
        context: { $ref: '#/components/schemas/Context' }
        expires_at: { type: string, format: date-time }
      required: [user_type, user_id, relation, object_type, object_id]
    PerformedBy:
      type: string
      description: >
        Audit author (the immutable trail's performed_by). PUBLIC listener:
        the authenticated JWT subject is authoritative — omit this field or
        send the same value; a DIFFERING value is rejected (403) unless
        ALLOW_SUBJECT_OVERRIDE is enabled (trusted-PEP deployments asserting
        on-behalf-of actors). INTERNAL callback listener: REQUIRED — the
        trusted OPA upstream passes the subject it authenticated here; with
        no JWT to fall back to, an omitted value is rejected (400) rather
        than stored as an empty attribution.
    Consistency:
      type: string
      enum: [applied, durable, eventual]
      description: >
        Per-transaction durability (maps to synchronous_commit): applied =
        remote_apply (strict revocation), durable = on, eventual = local.
        Omitted = the connection default.
    WriteTuplesRequest:
      type: object
      properties:
        tuples:
          type: array
          items: { $ref: '#/components/schemas/TupleInput' }
          minItems: 1
        consistency: { $ref: '#/components/schemas/Consistency' }
        performed_by: { $ref: '#/components/schemas/PerformedBy' }
      required: [tuples]
    WriteResponse:
      type: object
      properties:
        store: { type: string }
        written: { type: integer }
        revision:
          type: string
          description: Freshness token for this write (when enabled).
      required: [store, written]
    DeleteResponse:
      type: object
      properties:
        store: { type: string }
        deleted: { type: integer }
        revision: { type: string }
      required: [store, deleted]
    DeleteUserRequest:
      type: object
      properties:
        user: { $ref: '#/components/schemas/Subject' }
        consistency: { $ref: '#/components/schemas/Consistency' }
        performed_by: { $ref: '#/components/schemas/PerformedBy' }
      required: [user]
    GrantRequest:
      type: object
      properties:
        user: { $ref: '#/components/schemas/Subject' }
        user_relation:
          type: string
          description: Userset grantee (e.g. `member` for team#member).
        relation: { type: string }
        object: { $ref: '#/components/schemas/Resource' }
        condition:
          type: string
          description: Condition name to bind to the granted tuple (grant only).
        condition_context:
          type: object
          additionalProperties: true
        expires_at:
          type: string
          format: date-time
          description: Expiry of the granted tuple (grant only).
        context:
          type: object
          additionalProperties: true
          description: Request context for the ACTOR's check (conditions, gates).
        consistency: { $ref: '#/components/schemas/Consistency' }
        actor:
          type: string
          description: >
            Callback listener only: the upstream's asserted actor. On the
            public listener the actor is the token subject; a differing value
            is rejected unless ALLOW_SUBJECT_OVERRIDE.
      required: [user, relation, object]
    ApplyGrantsRequest:
      type: object
      properties:
        grants:
          type: array
          items: { $ref: '#/components/schemas/GrantEntry' }
        revokes:
          type: array
          items: { $ref: '#/components/schemas/GrantEntry' }
        context:
          type: object
          additionalProperties: true
          description: The actor's request context for entries that carry none of their own.
        consistency: { $ref: '#/components/schemas/Consistency' }
        actor:
          type: string
          description: Callback listener only (see /grant).
    GrantEntry:
      type: object
      description: One grant or revoke, in the engine's flat tuple shape.
      properties:
        user_type: { type: string }
        user_id: { type: string }
        user_relation: { type: string }
        relation: { type: string }
        object_type: { type: string }
        object_id: { type: string }
        condition: { type: string, description: grants only }
        condition_context: { type: object, additionalProperties: true }
        expires_at: { type: string, format: date-time, description: grants only }
        context: { type: object, additionalProperties: true, description: overrides the batch context for this entry }
      required: [user_type, user_id, relation, object_type, object_id]
    ApplyGrantsResponse:
      type: object
      properties:
        store: { type: string }
        granted: { type: integer, description: entries that wrote a tuple }
        revoked: { type: integer, description: entries that deleted a tuple }
        actor: { $ref: '#/components/schemas/Subject' }
        revision: { type: string }
      required: [store, granted, revoked, actor]
    RelationUsageRequest:
      type: object
      properties:
        action: { $ref: '#/components/schemas/Action' }
        resource: { $ref: '#/components/schemas/Resource' }
        subject_type:
          type: string
          description: Count only holders of this subject type (default every type of the store).
        limit:
          type: integer
          minimum: 1
          description: Resolution budget for the effective count; default max_effective when declared, else exhaustive.
        context:
          type: object
          additionalProperties: true
      required: [action, resource]
    RelationUsageResponse:
      type: object
      properties:
        store: { type: string }
        resource: { $ref: '#/components/schemas/Resource' }
        relation: { type: string }
        usage:
          type: object
          properties:
            direct_count: { type: integer, description: "Active (unexpired) direct tuples on the object for the relation, as written; a userset is one." }
            max_direct: { type: integer, nullable: true }
            direct_headroom: { type: integer, nullable: true }
            effective_count: { type: integer, nullable: true, description: "Subjects that resolve to the relation on the object; null when unbounded." }
            max_effective: { type: integer, nullable: true }
            effective_headroom: { type: integer, nullable: true }
            unbounded: { type: boolean, description: "A wildcard grant resolves to the relation: every subject of that type holds it." }
            limit_reached: { type: boolean, description: "The resolution stopped at the budget: effective_count is a lower bound." }
          required: [direct_count, effective_count, unbounded, limit_reached]
      required: [store, resource, relation, usage]
    RelationFull:
      type: object
      properties:
        status: { type: integer }
        error:
          type: string
          enum: [relation_full]
        message: { type: string }
        detail:
          type: object
          properties:
            code: { type: string }
            object_type: { type: string }
            object_id: { type: string }
            relation: { type: string }
            max_direct: { type: integer }
            direct_count: { type: integer }
      required: [status, error, message]
    GrantOptionsRequest:
      type: object
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        resource: { $ref: '#/components/schemas/Resource' }
        context:
          type: object
          additionalProperties: true
      required: [resource]
    GrantOptionsResponse:
      type: object
      properties:
        store: { type: string }
        actor: { $ref: '#/components/schemas/Subject' }
        resource: { $ref: '#/components/schemas/Resource' }
        options:
          type: array
          items:
            type: object
            properties:
              relation: { type: string }
              can_grant: { type: boolean }
              can_revoke: { type: boolean }
              requires: { type: string }
              requires_revoke: { type: string }
              grantee_types:
                type: array
                items: { type: string }
                description: "Who may hold the relation: user, team#member, user:* (wildcard allowed)."
            required: [relation, can_grant, can_revoke, requires, requires_revoke, grantee_types]
      required: [store, actor, resource, options]
    GrantResponse:
      type: object
      properties:
        store: { type: string }
        granted: { type: boolean, description: "grant: true = written, false = already present" }
        revoked: { type: boolean, description: "revoke: true = deleted, false = no such tuple" }
        actor: { $ref: '#/components/schemas/Subject' }
        revision: { type: string }
      required: [store, actor]
    WriteCheckedRequest:
      type: object
      properties:
        preconditions:
          type: array
          items:
            type: object
            additionalProperties: true
          description: >
            Preconditions (write_tuples_checked shape); all must hold or
            nothing is applied. `match: exists|absent` filters stored tuples
            (only the fields given constrain); `match: allowed|denied` runs a
            full access check for {user_type, user_id, relation, object_type,
            object_id, context?} — "write this grant only if the granter may".
        deletes:
          type: array
          items: { $ref: '#/components/schemas/TupleInput' }
        writes:
          type: array
          items: { $ref: '#/components/schemas/TupleInput' }
        consistency: { $ref: '#/components/schemas/Consistency' }
        performed_by: { $ref: '#/components/schemas/PerformedBy' }
    WriteCheckedResponse:
      type: object
      additionalProperties: true
      description: >
        authz.write_tuples_checked JSON verbatim — applied (bool), failed
        precondition detail, written/deleted counts.
    EventInput:
      type: object
      description: >
        One recorded action (record_events_jsonb element). action must be a
        declared relation of the store (the model is the action vocabulary);
        the subject is a concrete principal. payload is the authz-relevant
        projection (input.* / output.*), bounded by authz.max_context_bytes.
        occurred_at is bounded by authz.event_max_future_skew /
        event_max_backdate and defaults to the database clock.
      properties:
        subject_type: { type: string }
        subject_id: { type: string }
        action: { type: string, description: A relation name of the store. }
        object_type: { type: string }
        object_id: { type: string, description: Requires object_type. }
        kind:
          type: string
          enum: [request, response, denied]
          default: request
        payload:
          type: object
          additionalProperties: true
        occurred_at: { type: string, format: date-time }
        event_id:
          type: string
          description: >
            Idempotency key, unique per store (e.g. the PEP's request id +
            kind). A re-delivery is reported as a duplicate, not inserted.
            Requires occurred_at (the key is stable only together with the
            message's own timestamp); omitting it is a 400.
      required: [subject_type, subject_id, action]
      additionalProperties: false
    RecordEventsRequest:
      type: object
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/EventInput' }
          minItems: 1
        consistency: { $ref: '#/components/schemas/Consistency' }
        recorded_by:
          type: string
          description: >
            The asserting actor (events.recorded_by). Same trust rules as
            performed_by on the write endpoints: PUBLIC listener — the JWT
            subject is authoritative (omit or send the same value; a differing
            value is 403 unless ALLOW_SUBJECT_OVERRIDE); INTERNAL callback
            listener — REQUIRED, the trusted upstream's assertion.
      required: [events]
    RecordEventsResponse:
      type: object
      properties:
        store: { type: string }
        recorded: { type: integer, description: New rows inserted. }
        duplicates: { type: integer, description: Re-delivered event_ids skipped. }
        seqs:
          type: array
          description: Positional — the seq of each element, null for a duplicate.
          items: { type: integer, nullable: true }
        revision:
          type: string
          description: Freshness token for this write (when enabled).
      required: [store, recorded, duplicates, seqs]
    ReserveEventRequest:
      type: object
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        action: { $ref: '#/components/schemas/Action' }
        resource: { $ref: '#/components/schemas/Resource' }
        context: { $ref: '#/components/schemas/Context' }
        payload:
          type: object
          additionalProperties: true
          description: The projection recorded with the request event.
        event_id:
          type: string
          description: Idempotency key for this attempt; requires occurred_at. A re-delivery returns the decision with seq null.
        occurred_at: { type: string, format: date-time }
        record_denied:
          type: boolean
          default: true
          description: Record a `denied` event when refused (a sliding-window lockout gate is then extended by the attempt).
        consistency: { $ref: '#/components/schemas/Consistency' }
        recorded_by:
          type: string
          description: The asserting actor; same rules as on /pgauthz/v1/events.
      required: [action, resource]
    ReserveEventResponse:
      type: object
      properties:
        store: { type: string }
        allowed: { type: boolean }
        seq: { type: integer, nullable: true, description: The recorded event (request or denied); null when nothing was recorded or the key was a re-delivery. }
        kind: { type: string, nullable: true, enum: [request, denied, null] }
        reason: { type: string, enum: [allowed, gate_denied, graph_denied] }
        gates:
          type: array
          description: Per-clause outcomes of the temporal gates (counts and thresholds only).
          items:
            type: object
            additionalProperties: true
        revision: { type: string }
      required: [store, allowed, reason, gates]

    # ── errors & meta ────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        status: { type: integer }
        message: { type: string }
      required: [status, message]
    FreshnessConflict:
      type: object
      properties:
        status: { type: integer }
        error:
          type: string
          enum: [freshness_constraint_unsatisfied]
        verdict:
          type: string
          enum: [stale, wrong_epoch, unknown]
        primary_consulted:
          type: boolean
          description: The transparent fallback already re-checked the primary.
        message: { type: string, description: Per-verdict recovery guidance. }
      required: [status, error, verdict, primary_consulted, message]
    PolicyHookDenied:
      type: object
      description: >
        A mounted OPA policy hook (ADR 0011) vetoed the request. Denials are
        structured and attributable; hook identities surface only through
        authorized channels.
      properties:
        status: { type: integer }
        error: { type: string, enum: [denied_by_policy_hook] }
        denials:
          type: array
          items:
            type: object
            properties:
              tier: { type: string, enum: [global, store], description: "Whether the hook is global or store-scoped." }
              store: { type: string, description: "The store, when tier=store." }
              hook: { type: string, description: "The hook's package name under authz.hooks.v1." }
              code: { type: string, description: "Machine-readable denial code (denied for string denials)." }
              message: { type: string }
              evaluation_index: { type: integer, description: "Index of the offending evaluation in a batch (/evaluations) veto." }
            required: [tier, hook, code, message]
      required: [status, error, denials]
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok] }
      required: [status]
