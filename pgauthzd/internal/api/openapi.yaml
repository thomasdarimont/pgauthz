# OpenAPI description of pgauthzd's HTTP surface: the native /pgauthz/v1 API
# and the AuthZEN 1.0 /access/v1 API (plus health + discovery).
#
# This file is the CONTRACT: it is embedded into the binary and served at
# GET /pgauthz/v1/openapi.{json,yaml}, and openapi_test.go enforces it against
# the code — every path here must resolve in the router, every registered
# route must appear here, and handler responses are validated against the
# schemas. Change the API and the tests force this file to follow (and vice
# versa).
#
# Availability by deployment mode (THIS FILE describes the full surface; the
# SERVED document is TOPOLOGY-accurate — it lists exactly the routes the
# instance registers: an OPA-fronted instance omits the native paths its
# public listener does not register. It is deliberately not capability-pruned:
# a decision-only instance registers the write routes and answers a documented
# 403, so they stay in its document):
#   - AuthZEN /access/v1: always on the public listener.
#   - Native /pgauthz/v1 reads: public listener only when NOT fronting OPA
#     (no OPA_URL); always on the internal callback listener.
#   - Native /pgauthz/v1 writes: full profile only (decision-only → 403);
#     on the public listener additionally gated by the WRITER_ROLE claim.
#   - Native /pgauthz/v1/events (the action log, ADR 0012): full profile
#     only, like writes; on the public listener gated by the RECORDER_ROLE
#     claim (WRITER_ROLE passes too).
#   - The internal callback listener authenticates with the shared service
#     token (and optional mTLS), not the end-user JWT, and additionally
#     honors the X-PGAuthz-Role header from its trusted OPA upstream.
#
# Native operations carry a machine-readable `x-pgauthz-availability`
# extension: `listeners` (where the operation exists), `public_listener:
# not-when-opa-fronted`, and `profile: full` on writes — so generators and
# scanners can tell instance-conditional operations from universal ones.
openapi: 3.0.3
info:
  title: pgauthzd
  description: >
    PostgreSQL-native Zanzibar-style authorization over HTTP: the pgauthz
    native API (raw graph decisions, search, explain, watch, tuple writes)
    and the AuthZEN 1.0 access evaluation/search API.
  # Placeholder — replaced at startup with the build version (the same value
  # build_info reports); see api.SetOpenAPIVersion.
  version: 0.0.0-dev
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

# Default: the public listener's end-user/service JWT. Native operations
# additionally accept the shared service token — that is how the SAME paths
# are authenticated on the internal callback listener (declared per
# operation below as bearerAuth OR serviceToken). Discovery, health, and this
# document are public (security: []).
security:
  - bearerAuth: []

tags:
  - name: authzen
    description: AuthZEN 1.0 access evaluation and search (spec-pure surface).
  - name: native-read
    description: >
      Native pgauthz reads — raw ReBAC graph answers, policy-free by
      construction. Point reads honor the freshness protocol — see the
      X-PGAuthz-Consistency header.
  - name: native-write
    description: >
      Native pgauthz writes (full profile). Successful writes mint a freshness
      token (X-PGAuthz-Revision) when FRESHNESS_TOKEN_KEYS is configured.
  - name: admin
    description: >
      The management API (`ADMIN_API_ENABLED=true`, a full instance): the
      privileged surface configuration-as-code tooling (Terraform, pgauthzctl)
      and the console use, under its own path prefix `/pgauthz/v1/admin/` and,
      with `ADMIN_LISTEN_ADDR`, on its own listener (the public listener then
      serves none of these routes, and this document omits them). Every call
      passes the admin gate: the token's issuer carries an `admin` binding in
      `JWT_ISSUERS` whose scopes / claims / clients the token satisfies, or the
      token holds `ADMIN_ROLE` — or, on an admin listener with mTLS, the
      verified client certificate is mapped by `ADMIN_CLIENT_CERTS` and the
      call carries no token at all. Management is scoped per tenant: an issuer's
      admin binding manages that issuer's own binding (`scope: issuer`, the
      default); only `scope: platform` (and `ADMIN_ROLE`) reaches every
      issuer; stores follow the issuer's stores binding and the model
      registry needs platform scope. Writes are recorded with the token's
      subject and client, or the certificate's identity.
  - name: meta
    description: >
      Health, AuthZEN PDP discovery (`/.well-known/authzen-configuration`, §9 —
      per store in the §9.2 tenant form), and this document.

# The server is the instance that serves this document: the SERVED copy stamps
# this entry with the instance's public base URL (BASE_URL, or the forwarded
# scheme/host with TRUST_FORWARDED_HEADERS, else the request's own), so a
# Swagger UI / Postman loading it from /pgauthz/v1/openapi.json calls the right
# place. The file on its own says "/" — same origin as wherever it is served.
servers:
  - url: /
    description: The pgauthzd instance serving this document.

paths:
  # ── AuthZEN 1.0 ────────────────────────────────────────────────────────────
  /access/v1/evaluation:
    post:
      tags: [authzen]
      operationId: evaluation
      summary: Single access evaluation (AuthZEN §5)
      parameters:
        - $ref: '#/components/parameters/StoreHeader'
        - $ref: '#/components/parameters/DetailHeader'
        - $ref: '#/components/parameters/ConsistencyHeader'
        - $ref: '#/components/parameters/RevisionHeader'
      requestBody: { $ref: '#/components/requestBodies/Evaluation' }
      responses:
        '200': { $ref: '#/components/responses/EvaluationOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/FreshnessConflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /stores/{store}/access/v1/evaluation:
    post:
      tags: [authzen]
      operationId: evaluationStore
      summary: Single access evaluation, store-scoped
      parameters:
        - $ref: '#/components/parameters/StorePath'
        - $ref: '#/components/parameters/DetailHeader'
        - $ref: '#/components/parameters/ConsistencyHeader'
        - $ref: '#/components/parameters/RevisionHeader'
      requestBody: { $ref: '#/components/requestBodies/Evaluation' }
      responses:
        '200': { $ref: '#/components/responses/EvaluationOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/FreshnessConflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /access/v1/evaluations:
    post:
      tags: [authzen]
      operationId: evaluations
      summary: Batch access evaluations (AuthZEN §6)
      parameters:
        - $ref: '#/components/parameters/StoreHeader'
        - $ref: '#/components/parameters/ConsistencyHeader'
        - $ref: '#/components/parameters/RevisionHeader'
      requestBody: { $ref: '#/components/requestBodies/Evaluations' }
      responses:
        '200': { $ref: '#/components/responses/EvaluationsOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EvaluationsForbidden' }
        '409': { $ref: '#/components/responses/FreshnessConflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /stores/{store}/access/v1/evaluations:
    post:
      tags: [authzen]
      operationId: evaluationsStore
      summary: Batch access evaluations, store-scoped
      parameters:
        - $ref: '#/components/parameters/StorePath'
        - $ref: '#/components/parameters/ConsistencyHeader'
        - $ref: '#/components/parameters/RevisionHeader'
      requestBody: { $ref: '#/components/requestBodies/Evaluations' }
      responses:
        '200': { $ref: '#/components/responses/EvaluationsOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EvaluationsForbidden' }
        '409': { $ref: '#/components/responses/FreshnessConflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /access/v1/search/subject:
    post:
      tags: [authzen]
      operationId: searchSubject
      summary: Subject search — who can act on this resource? (AuthZEN §7)
      parameters:
        - $ref: '#/components/parameters/StoreHeader'
        - $ref: '#/components/parameters/ConsistencyHeader'
        - $ref: '#/components/parameters/RevisionHeader'
      requestBody: { $ref: '#/components/requestBodies/SearchSubject' }
      responses:
        '200': { $ref: '#/components/responses/SearchSubjectOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/FreshnessConflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /stores/{store}/access/v1/search/subject:
    post:
      tags: [authzen]
      operationId: searchSubjectStore
      summary: Subject search, store-scoped
      parameters:
        - $ref: '#/components/parameters/StorePath'
        - $ref: '#/components/parameters/ConsistencyHeader'
        - $ref: '#/components/parameters/RevisionHeader'
      requestBody: { $ref: '#/components/requestBodies/SearchSubject' }
      responses:
        '200': { $ref: '#/components/responses/SearchSubjectOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/FreshnessConflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /access/v1/search/resource:
    post:
      tags: [authzen]
      operationId: searchResource
      summary: Resource search — which resources can the subject act on? (AuthZEN §8)
      parameters:
        - $ref: '#/components/parameters/StoreHeader'
        - $ref: '#/components/parameters/ConsistencyHeader'
        - $ref: '#/components/parameters/RevisionHeader'
      requestBody: { $ref: '#/components/requestBodies/SearchResource' }
      responses:
        '200': { $ref: '#/components/responses/SearchResourceOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/FreshnessConflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /stores/{store}/access/v1/search/resource:
    post:
      tags: [authzen]
      operationId: searchResourceStore
      summary: Resource search, store-scoped
      parameters:
        - $ref: '#/components/parameters/StorePath'
        - $ref: '#/components/parameters/ConsistencyHeader'
