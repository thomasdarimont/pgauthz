                  model: { type: string }
                  stores:
                    type: array
                    items:
                      type: object
                      properties:
                        store: { type: string }
                        model_version: { type: integer }
                        latest_version: { type: integer }
                        in_sync: { type: boolean }
                        applied_at: { type: string, format: date-time }
