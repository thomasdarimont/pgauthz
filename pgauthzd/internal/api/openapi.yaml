  /pgauthz/v1/issuers:
    get:
      tags: [native-read]
      security:
        - bearerAuth: []
        - serviceToken: []
      x-pgauthz-availability:
        listeners: [public, internal-callback]
        public_listener: not-when-opa-fronted
      operationId: issuers
      summary: The effective trusted-issuer set
      description: >
        The issuers this instance trusts — anchors with the signing-key source
        redacted to `url` / `file`, the bindings (stores, DB roles, client
        roles, PEP clients), whether each issuer's bindings come from the
        environment or the database (`ISSUERS_SOURCE=env+db`,
        authz.issuer_bindings), whether its tokens are accepted (`enabled`),
        and the applied database revision. On the public listener only for
        callers holding ISSUERS_REQUIRED_ROLE (403 otherwise, or when the
        role is unset); the internal callback listener always serves it.
        Multi-tenancy: a caller sees its OWN issuer only (the one that signed
        its token); the whole set is served only to a platform admin (the
        admin gate with `scope: platform`, or `ADMIN_ROLE`).
      responses:
        '200':
          description: The effective issuer set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuerSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # ── management (admin API) ─────────────────────────────────────────────────
  /pgauthz/v1/admin/issuers:
    get:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminIssuers
      summary: The effective trusted-issuer set within the caller's scope
      description: >
        The same document as `/pgauthz/v1/issuers`, behind the admin gate
        instead of ISSUERS_REQUIRED_ROLE: a tenant admin (`scope: issuer`)
        sees its own issuer, a platform admin every issuer. Entries carry
        the issuer's `admin` binding when it has one.
      responses:
        '200':
          description: The effective issuer set within the caller's scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuerSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /pgauthz/v1/admin/issuer-bindings:
    get:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminIssuerBindings
      summary: The database-managed issuer bindings within the caller's scope
      description: >
        The rows of `authz.issuer_bindings` (ISSUERS_SOURCE=env+db) the caller
        may manage — all of them for a platform admin, the own issuer's for a
        tenant admin. With `issuer`, that one row (404 when absent or out of
        scope).
      parameters:
        - name: issuer
          in: query
          required: false
          schema: { type: string }
          description: Return the binding of this issuer only.
      responses:
        '200':
          description: The bindings (an object with `bindings` and the database `revision`), or the one binding with `issuer`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [bindings, revision]
                    properties:
                      bindings:
                        type: array
                        items: { $ref: '#/components/schemas/IssuerBinding' }
                      revision: { type: integer, format: int64, description: The rows' revision (authz.issuer_bindings_revision). }
                  - $ref: '#/components/schemas/IssuerBinding'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    put:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminSetIssuerBinding
      summary: Create or replace an issuer's binding
      description: >
        The whole row, as the console edits it — validated as the daemon
        validates (anchored patterns, PEP clients covered by stores) and
        against the environment's binding (a row may only NARROW the stores
        the environment grants, never unbind or widen; an issuer the
        environment does not trust is refused — the database never adds
        trust). The issuer must be within the caller's scope. Every
        instance with ISSUERS_SOURCE=env+db applies the returned revision
        (NOTIFY, else the poll).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssuerBinding' }
      responses:
        '200':
          description: The binding is stored.
          content:
            application/json:
              schema:
                type: object
                required: [issuer, revision]
                properties:
                  issuer: { type: string }
                  revision: { type: integer, description: The revision the fleet will apply. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    delete:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminDeleteIssuerBinding
      summary: Delete an issuer's binding
      description: >
        The issuer falls back to its environment bindings (JWT_ISSUERS).
        The issuer must be within the caller's scope.
      parameters:
        - name: issuer
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The binding is deleted.
          content:
            application/json:
              schema:
                type: object
                required: [issuer, deleted]
                properties:
                  issuer: { type: string }
                  deleted: { type: boolean, enum: [true] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /pgauthz/v1/admin/stores:
    get:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminStores
      summary: The stores within the caller's scope, with their model state
      description: >
        Every store a platform admin may manage; for a tenant admin the stores
        its issuer is bound to (an unbound issuer manages none). Live and
        retired stores; a live store carries its managed-model state
        (authz.model_status).
      responses:
        '200':
          description: The stores.
          content:
            application/json:
              schema:
                type: object
                required: [stores]
                properties:
                  stores:
                    type: array
                    items: { $ref: '#/components/schemas/AdminStore' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /pgauthz/v1/admin/stores/{store}:
    parameters:
      - { name: store, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z_][a-zA-Z0-9_]{0,62}$' } }
    get:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminStore
      summary: One store with its model state
      responses:
        '200':
          description: The store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    put:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminUpsertStore
      summary: Create a store, or set its description, documentation link, or retire it
      description: >
        The upsert a configuration-as-code tool uses: an unknown store is
        created (201), a known one updated (200). Absent fields are left
        alone; an empty string clears a field; `retired: true` retires the
        store (authz.retire_store — its tuples go, its history stays; a
        retired store cannot be reopened, so `retired: false` on one is a
        400). Recorded with the credential's identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
                docs_url: { type: string, description: An http(s) link the console renders. }
                retired: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStoreResult' }
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStoreResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    delete:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminDeleteStore
      summary: Remove a store physically
      description: >
        authz.delete_store — the erasure path: the store's tuples, model,
        conditions, gates, grant rules and action log go; `purge_audit=true`
        removes its audit rows too (otherwise they stay, name-unresolvable).
        Prefer `retired: true` for a store that may still be asked about
        historically.
      parameters:
        - { name: purge_audit, in: query, required: false, schema: { type: boolean } }
        - { name: purge_decisions, in: query, required: false, schema: { type: boolean }, description: "Also purge this incarnation's lines and the store's tombstones from the postgres decision-log sink this instance writes, behind a store fence (default: keep). Refused with 501 before anything is deleted when this instance writes no such sink; a sink failure after the engine's delete answers 502 `partial` — retry with DELETE …/stores/{store}/decisions?store_id=." }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [store, deleted]
                properties:
                  store: { type: string }
                  store_id: { type: integer, description: The deleted incarnation (for the purge's retry). }
                  deleted: { type: boolean, enum: [true] }
                  deleted_at: { type: string, format: date-time }
                  purged_audit: { type: boolean }
                  purged_decisions: { type: boolean }
                  decisions: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /pgauthz/v1/admin/stores/{store}/model:
    parameters:
      - { name: store, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z_][a-zA-Z0-9_]{0,62}$' } }
    get:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminStoreModel
      summary: The store's live model (the canonical definition) and its managed-model state
      parameters:
        - { name: dsl, in: query, required: false, schema: { type: boolean }, description: Also render the model as OpenFGA-style DSL text (display only). }
      responses:
        '200':
          description: The model.
          content:
            application/json:
              schema:
                type: object
                required: [store, definition, status]
                properties:
                  store: { type: string }
                  definition: { $ref: '#/components/schemas/ModelDefinition' }
                  status: { $ref: '#/components/schemas/ModelStatus' }
                  dsl: { type: string, description: With dsl=true. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    put:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminApplyModel
      summary: Make the store run a registry version (apply), or plan it
      description: >
        Plans first (authz.plan_model_apply) and applies only a plan without
        blockers (authz.apply_model: the store's model becomes the version's,
        the store is then managed by that model). With `?plan=true` the plan
        is returned and nothing is applied. Blockers — a type still
        referenced by tuples, a relation with tuples that would go — answer
        409 with the plan.
      parameters:
        - { name: plan, in: query, required: false, schema: { type: boolean }, description: Dry run. }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: { type: string, description: '"name" (latest) or "name@version".', example: saas_core@3 }
      responses:
        '200':
          description: Applied, or (plan=true) the plan.
          content:
            application/json:
              schema:
                type: object
                required: [store, model, plan]
                properties:
                  store: { type: string }
                  model: { type: string }
                  applied: { type: integer, description: The version applied (absent for a plan). }
                  can_apply: { type: boolean }
                  plan: { $ref: '#/components/schemas/ModelPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The plan reports blockers; nothing was applied.
          content:
            application/json:
              schema:
                type: object
                required: [status, message, plan]
                properties:
                  status: { type: integer, enum: [409] }
                  message: { type: string }
                  store: { type: string }
                  model: { type: string }
                  can_apply: { type: boolean, enum: [false] }
                  plan: { $ref: '#/components/schemas/ModelPlan' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /pgauthz/v1/admin/issuer-bindings/audit:
    get:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminIssuerBindingsAudit
      summary: The issuer bindings' history within the caller's scope, one page
      description: >
        One page of `authz.issuer_bindings_audit`, newest first, keyset by
        `seq` (`before` is the previous page's `next`), with the total for a
        pager. A tenant admin reads its own issuer's history only — the
        filter is set for it, another issuer is refused (403).
      parameters:
        - { name: issuer, in: query, required: false, schema: { type: string }, description: One issuer's history (a tenant admin's own). }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 25 } }
        - { name: before, in: query, required: false, schema: { type: integer, format: int64 }, description: The previous page's `next`. }
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema:
                type: object
                required: [rows, next, total, limit]
                properties:
                  rows:
                    type: array
                    items: { $ref: '#/components/schemas/IssuerBindingAudit' }
                  next: { type: string, description: "Pass as `before` for the next page; empty on the last." }
                  total: { type: integer, format: int64 }
                  limit: { type: integer }
                  issuer: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /pgauthz/v1/admin/stores/{store}/decisions:
    parameters:
      - { name: store, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z_][a-zA-Z0-9_]{0,62}$' } }
    delete:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminPurgeStoreDecisions
      summary: Purge a deleted incarnation's decision-log lines
      description: >
        The lines of one DELETED incarnation of the store (`store_id`, from
        the deletion's answer or `GET …/deletions`), the lines without an id
        decided up to its deletion time, and the tombstones up to then,
        behind the store fence (`decisionlog.store_fences`). The incarnation
        must have the engine's deletion receipt (404 otherwise), so a live
        store cannot be fenced by mistake. The retry of a deletion whose
        purge failed. Idempotent; needs the postgres sink (501 otherwise).
      parameters:
        - { name: store_id, in: query, required: true, schema: { type: integer }, description: The deleted incarnation. }
      responses:
        '200':
          description: Purged.
          content:
            application/json:
              schema:
                type: object
                required: [store, store_id, purged_decisions, deleted_at, decisions]
                properties:
                  store: { type: string }
                  store_id: { type: integer }
                  purged_decisions: { type: boolean }
                  deleted_at: { type: string, format: date-time, description: The receipt's deletion time. }
                  decisions: { type: integer, description: Persisted lines deleted now. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No deletion receipt for that incarnation of the store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '502':
          description: The sink could not be reached or the purge failed; retry.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /pgauthz/v1/admin/stores/{store}/deletions:
    parameters:
      - { name: store, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z_][a-zA-Z0-9_]{0,62}$' } }
    get:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminStoreDeletions
      summary: The engine's deletion receipts for a store name
      description: Every physical deletion of a store of this name (`authz.store_deletions`), newest first — the incarnations a decision-log purge may name.
      responses:
        '200':
          description: The receipts.
          content:
            application/json:
              schema:
                type: object
                required: [store, deletions]
                properties:
                  store: { type: string }
                  deletions:
                    type: array
                    items: { $ref: '#/components/schemas/StoreDeletion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /pgauthz/v1/admin/stores/{store}/subjects/{type}/{id}/objects:
    parameters:
      - { name: store, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z_][a-zA-Z0-9_]{0,62}$' } }
      - { name: type, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z_][a-zA-Z0-9_]{0,62}$' }, description: The subject's type. }
      - { name: id, in: path, required: true, schema: { type: string }, description: "The subject's id (one concrete id, no wildcard)." }
    get:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminSubjectObjects
      summary: Data subject takeout — every object the subject reaches, as rows or CSV
      description: |
        One row per (object type, relation, object id) the subject reaches
        (`authz.list_subject_objects`): `direct` says a tuple names it
        outright, `is_wildcard` marks the "every object" row, `truncated`
        that a pair hit the limit. `format=csv` answers `text/csv` with the
        store and subject in every row, the file handed to the application
        teams (PRODUCTION.md → Data subject requests).
      parameters:
        - { name: relations, in: query, schema: { type: string }, description: "Comma-separated relations to restrict to (default: every relation of the model)." }
        - { name: object_types, in: query, schema: { type: string }, description: "Comma-separated object types to restrict to (default: every type)." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 10000 }, description: "Objects per (type, relation) pair; `truncated` marks a pair that hit it." }
        - { name: format, in: query, schema: { type: string, enum: [json, csv] }, description: "`csv` streams the rows as text/csv." }
      responses:
        '200':
          description: The rows.
          content:
            application/json:
              schema:
                type: object
                required: [store, subject, objects, truncated]
                properties:
                  store: { type: string }
                  subject: { $ref: '#/components/schemas/SubjectRef' }
                  objects:
                    type: array
                    items: { $ref: '#/components/schemas/SubjectObject' }
                  truncated: { type: boolean, description: Some pair hit the limit. }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /pgauthz/v1/admin/stores/{store}/subjects/{type}/{id}:
    parameters:
      - { name: store, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z_][a-zA-Z0-9_]{0,62}$' } }
      - { name: type, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z_][a-zA-Z0-9_]{0,62}$' }, description: The subject's type. }
      - { name: id, in: path, required: true, schema: { type: string }, description: "The subject's id (one concrete id, no wildcard)." }
    get:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminSubjectExport
      summary: Data subject export — one JSON document about the person
      description: |
        `authz.export_subject`: the direct tuples on either side (expired
        ones marked), the effective objects, the events by and about the
        person, the audit rows, each with its `*_truncated` flag. The
        decision log is not part of it — this instance's sink is
        write-only; the console's export adds the lines.
      parameters:
        - { name: relations, in: query, schema: { type: string }, description: "Comma-separated relations to restrict `effective` to." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 10000 }, description: Cap per list. }
      responses:
        '200':
          description: The export document.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /pgauthz/v1/admin/stores/{store}/recorders:
    parameters:
