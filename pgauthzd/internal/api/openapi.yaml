  /pgauthz/v1/admin/models/{name}/versions:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z_][a-zA-Z0-9_]*$' } }
    post:
      tags: [admin]
      security:
        - bearerAuth: []
      x-pgauthz-availability:
        listeners: [public, admin]
        public_listener: only-when-admin-api-enabled-without-admin-listener
      operationId: adminPublishModel
      summary: Publish the next version of a model (platform scope)
      description: >
        From a store's live model (`from_store`, authz.publish_model), from
        a definition in the canonical export shape (`definition`,
        authz.publish_model_definition — the model file in git, no staging
        store), or from an OpenFGA model (`openfga`, what a .fga file parses
        to; authz.publish_model_openfga converts it through an ephemeral
        store on the server). Idempotent on the checksum: an unchanged model
        answers the existing latest version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from_store: { type: string }
                definition: { $ref: '#/components/schemas/ModelDefinition' }
                openfga: { type: object, additionalProperties: true, description: "An OpenFGA authorization model (schema_version and type_definitions)." }
                description: { type: string, description: What changed. }
      responses:
        '200':
          description: The version (new or existing).
          content:
            application/json:
              schema:
                type: object
                required: [model, version]
                properties:
                  model: { type: string }
                  version: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
