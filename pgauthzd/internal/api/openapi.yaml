        '409': { $ref: '#/components/responses/FreshnessConflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ── AuthZEN discovery (§9) ─────────────────────────────────────────────────
  /.well-known/authzen-configuration:
    get:
      tags: [meta]
      operationId: wellKnown
      summary: AuthZEN PDP metadata (§9.1, §9.2)
      description: >
        The PDP metadata document of AuthZEN 1.0 §9.1 for the instance as a
        whole: `policy_decision_point` is this instance's base URL (its
        identifier, §9.1.1), the five `*_endpoint` values are its `/access/v1`
        endpoints, and `capabilities` lists what it implements. Served without
        authentication (§9.2: a PEP fetches it before it has anything to
        authenticate with). Requests to these endpoints resolve the store as
        usual — `X-PGAuthz-Store`, else `DEFAULT_STORE`; for a document whose
        endpoints are scoped to ONE store use the tenant form below.
        §9.2.3: the `policy_decision_point` in the response must be identical
        to the identifier the metadata was fetched for, so behind a reverse
        proxy set `BASE_URL`, or `TRUST_FORWARDED_HEADERS=true` to take scheme
        and host from `X-Forwarded-Proto` / `X-Forwarded-Host`.
      security: []
      responses:
        '200': { $ref: '#/components/responses/WellKnownOK' }
  /.well-known/authzen-configuration/stores/{store}:
    get:
      tags: [meta]
      operationId: wellKnownStoreInserted
      summary: AuthZEN PDP metadata for one store (§9.2 tenant form)
      description: >
        Each pgauthz store presents as its own AuthZEN PDP with the identifier
        `<base>/stores/{store}`. AuthZEN 1.0 §9.2 forms the discovery URL by
        INSERTING `/.well-known/authzen-configuration` between host and the
        identifier's path (as RFC 8414 does for issuers with a path), so the
        metadata of the PDP `https://pdp.example.com/stores/tenant1` lives at
        `https://pdp.example.com/.well-known/authzen-configuration/stores/tenant1`.
        The document's `policy_decision_point` and every endpoint carry the
        `/stores/{store}` prefix, so a PEP configured with nothing but that
        identifier discovers endpoints that decide in that store only — the
        form the OpenID conformance suite uses (`conformance/`).
      security: []
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '200': { $ref: '#/components/responses/WellKnownOK' }
  /stores/{store}/.well-known/authzen-configuration:
    get:
      tags: [meta]
      operationId: wellKnownStorePath
      summary: AuthZEN PDP metadata for one store (path-suffixed convenience form)
      description: >
        The same store-scoped document as the §9.2 form above, reachable by
        appending the well-known path to the store's identifier — for clients
        and gateways that concatenate rather than insert. Prefer the §9.2 form
        for anything that follows the specification's discovery algorithm.
      security: []
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '200': { $ref: '#/components/responses/WellKnownOK' }

  /pgauthz/v1/docs:
    get:
      tags: [meta]
      operationId: swaggerUI
      summary: Embedded Swagger UI for this document (SWAGGER_UI_ENABLED)
      description: >
        Renders this instance's OpenAPI document in Swagger UI, same origin as
        the API so "Try it out" needs no CORS (Authorize with a bearer JWT).
        A developer convenience, off by default: registered only with
        SWAGGER_UI_ENABLED=true (which needs OPENAPI_ENABLED). The UI's assets
        are vendored into the binary (swagger-ui-dist, pinned by
        scripts/vendor-swagger-ui.sh) — nothing is loaded from a CDN, and the
        page's Content-Security-Policy allows scripts from this origin only.
        Public, like the document it renders.
      security: []
      x-pgauthz-availability:
        listeners: [public]
        flag: SWAGGER_UI_ENABLED
      responses:
        '200':
          description: The Swagger UI page.
          content:
            text/html:
              schema: { type: string }
  /pgauthz/v1/docs/{asset}:
    get:
      tags: [meta]
      operationId: swaggerUIAsset
      summary: A Swagger UI asset (SWAGGER_UI_ENABLED)
      description: >
        One of the vendored Swagger UI files (swagger-ui.css,
        swagger-ui-bundle.js, favicon-32x32.png, LICENSE, NOTICE,
        swagger-ui-bundle.js.LICENSE.txt, VERSION) or pgauthzd's own
        pgauthz-initializer.js; anything else is 404.
      security: []
      x-pgauthz-availability:
        listeners: [public]
        flag: SWAGGER_UI_ENABLED
      parameters:
        - name: asset
          in: path
          required: true
          schema: { type: string }
          description: File name, no path separators.
      responses:
        '200':
          description: The asset.
          content:
            text/css: { schema: { type: string } }
            application/javascript: { schema: { type: string } }
            image/png: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Native reads ───────────────────────────────────────────────────────────
  /pgauthz/v1/check:
    post:
      tags: [native-read]
      security:
        - bearerAuth: []
        - serviceToken: []
      x-pgauthz-availability:
        listeners: [public, internal-callback]
        public_listener: not-when-opa-fronted
      operationId: check
      summary: Raw access decision
      parameters:
        - $ref: '#/components/parameters/StoreHeader'
        - $ref: '#/components/parameters/ConsistencyHeader'
        - $ref: '#/components/parameters/RevisionHeader'
      requestBody: { $ref: '#/components/requestBodies/NativeCheck' }
      responses:
        '200': { $ref: '#/components/responses/NativeCheckOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/FreshnessConflict' }
        '500': { $ref: '#/components/responses/ServerError' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /stores/{store}/pgauthz/v1/check:
    post:
      tags: [native-read]
      security:
        - bearerAuth: []
        - serviceToken: []
      x-pgauthz-availability:
        listeners: [public, internal-callback]
        public_listener: not-when-opa-fronted
      operationId: checkStore
      summary: Raw access decision, store-scoped
      parameters:
        - $ref: '#/components/parameters/StorePath'
        - $ref: '#/components/parameters/ConsistencyHeader'
        - $ref: '#/components/parameters/RevisionHeader'
      requestBody: { $ref: '#/components/requestBodies/NativeCheck' }
      responses:
        '200': { $ref: '#/components/responses/NativeCheckOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/FreshnessConflict' }
        '500': { $ref: '#/components/responses/ServerError' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /pgauthz/v1/check-batch:
    post:
      tags: [native-read]
      security:
        - bearerAuth: []
        - serviceToken: []
      x-pgauthz-availability:
        listeners: [public, internal-callback]
        public_listener: not-when-opa-fronted
      operationId: checkBatch
      summary: Many raw decisions in one round-trip
      parameters:
        - $ref: '#/components/parameters/StoreHeader'
        - $ref: '#/components/parameters/ConsistencyHeader'
        - $ref: '#/components/parameters/RevisionHeader'
      requestBody: { $ref: '#/components/requestBodies/NativeCheckBatch' }
      responses:
        '200': { $ref: '#/components/responses/NativeCheckBatchOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/FreshnessConflict' }
        '500': { $ref: '#/components/responses/ServerError' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /stores/{store}/pgauthz/v1/check-batch:
    post:
      tags: [native-read]
      security:
        - bearerAuth: []
        - serviceToken: []
      x-pgauthz-availability:
        listeners: [public, internal-callback]
        public_listener: not-when-opa-fronted
      operationId: checkBatchStore
      summary: Many raw decisions, store-scoped
      parameters:
        - $ref: '#/components/parameters/StorePath'
        - $ref: '#/components/parameters/ConsistencyHeader'
        - $ref: '#/components/parameters/RevisionHeader'
      requestBody: { $ref: '#/components/requestBodies/NativeCheckBatch' }
      responses:
        '200': { $ref: '#/components/responses/NativeCheckBatchOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/FreshnessConflict' }
        '500': { $ref: '#/components/responses/ServerError' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /pgauthz/v1/list-objects:
    post:
      tags: [native-read]
      security:
        - bearerAuth: []
        - serviceToken: []
      x-pgauthz-availability:
        listeners: [public, internal-callback]
        public_listener: not-when-opa-fronted
      operationId: listObjects
      summary: Which objects of a type can the subject act on?
      parameters:
        - $ref: '#/components/parameters/StoreHeader'
        - $ref: '#/components/parameters/ConsistencyHeader'
