  /pgauthz/v1/events:
    post:
      tags: [native-write]
      security:
        - bearerAuth: []
        - serviceToken: []
      x-pgauthz-availability:
        listeners: [public, internal-callback]
        public_listener: not-when-opa-fronted
        profile: full
      operationId: recordEvents
      summary: Record what principals actually did (the action log)
      description: >
        Feeds authz.events, the store-scoped, append-only action log a PEP
        reports to AFTER (or around) an action ran — independent of any
        decision pgauthz made. Atomic per batch; a re-delivered event_id is
        counted as a duplicate, never inserted twice. Public listener: the
        caller must hold RECORDER_ROLE (or WRITER_ROLE) and recorded_by is
        token-derived; callback listener: recorded_by is required and trusted.
        An undeclared action (not a relation of the store), an out-of-bounds
        occurred_at, or a malformed element is a 400; a namespace refusal 403.
      parameters:
        - $ref: '#/components/parameters/StoreHeader'
      requestBody: { $ref: '#/components/requestBodies/RecordEvents' }
      responses:
        '200': { $ref: '#/components/responses/RecordEventsOK' }
